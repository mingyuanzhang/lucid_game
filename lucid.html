/* ===========================================================================
   LUCID — Level 1: The Ridge
   A philosophical casual platformer on existential dread and human illusion.
   Vertical slice: Total Lucidity, the Armor Wheel, The Climb, The Routine.
   Everything (art, audio, type) is generated at runtime. No assets.
   =========================================================================== */

/* ---------------------------------------------------------------- utility */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutExpo=t=>t>=1?1:1-Math.pow(2,-9*t);
const easeInCubic=t=>t*t*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a),0,1);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const RND=mulberry32(20260813);
function rr(a,b){return a+(b-a)*RND();}

// value noise for ridgelines
function makeNoise(seed){
  const r=mulberry32(seed), tab=new Float32Array(512);
  for(let i=0;i<512;i++) tab[i]=r();
  return x=>{const i=Math.floor(x),f=x-i,a=tab[i&511],b=tab[(i+1)&511];return lerp(a,b,smooth(f));};
}
function fbm(nz,x,oct,lac,gain){let s=0,amp=1,fr=1,norm=0;for(let i=0;i<oct;i++){s+=nz(x*fr)*amp;norm+=amp;amp*=gain;fr*=lac;}return s/norm;}

function hex(h,a){ // '#rrggbb' -> rgba string
  const n=parseInt(h.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* World coordinates: +x right, +y down. Each level supplies its own ground,
   its own voids, its own palette and props. Everything downstream reads the
   active level `L` rather than baked-in constants. */

function makeRidge(seed,amp,base,step,span,rough){
  const nz=makeNoise(seed), pts=[];
  for(let x=-2600;x<=span;x+=step){ pts.push([x,base-fbm(nz,x*rough,4,2.1,0.5)*amp]); }
  return pts;
}

/* ------------------------------------------------------------ THE WALK ---
   Level one is mostly a walk. Once the ladder has set you down on the far lip
   there is a very great deal of ridge and nothing whatever on it: no gap, no
   wall, no armour worth reaching for, nothing that wants anything from you. It
   takes something like two and a half minutes at the speed this state moves you
   at, and the length is the whole of the content. The game has just spent a
   minute proving it can hold your attention with a scoreboard and a clock. Now
   it takes both away and asks whether you will stay anyway.

   Nothing in here is generated to be surprising. It rises and falls, the light
   goes, the flowers run down, and the peak stays exactly as far away as it is. */
function makeWalk(keys,step,seed,amp,maxSlope){
  const nz=makeNoise(seed), out=[];
  const last=keys[keys.length-1][0];
  let k=0, y=keys[0][1];
  for(let x=keys[0][0];x<=last;x+=step){
    while(k<keys.length-2&&x>keys[k+1][0]) k++;
    const a=keys[k], b=keys[k+1];
    const want=lerp(a[1],b[1],smooth(clamp((x-a[0])/(b[0]-a[0]),0,1)))
               +(fbm(nz,x*0.0019,4,2.1,0.5)-0.5)*amp;
    // never steeper than a person can walk up, or it stops being a walk
    if(out.length) y+=clamp(want-y,-step*maxSlope,step*maxSlope);
    out.push([x,Math.round(y)]);
  }
  return out;
}

let L=LEVELS[0], PROPS=null, REGIONS=[];

// The ridge is long enough now that walking the point list per lookup shows up
// in the frame time. The points are sorted, so bisect them.
function terrainAt(x){
  const T=L.terrain, n=T.length;
  if(x<=T[0][0]) return T[0][1];
  if(x>=T[n-1][0]) return T[n-1][1];
  let lo=0,hi=n-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(T[m][0]<=x) lo=m; else hi=m; }
  const a=T[lo],b=T[hi];
  return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]));
}
function terrainY(x){
  for(const g of L.gaps) if(x>g.x0&&x<g.x1) return null;
  return terrainAt(x);
}
function terrainYSafe(x){
  const y=terrainY(x);
  if(y!==null) return y;
  for(const g of L.gaps) if(x>g.x0&&x<g.x1){
    const a=terrainYRaw(g.x0), b=terrainYRaw(g.x1);
    return lerp(a,b,inv(g.x0,g.x1,x));
  }
  return 600;
}
function terrainYRaw(x){ return terrainAt(x); }
// Ground you could actually stand on: solid, and not a sheer face.
function standable(x){
  const y=terrainY(x); if(y===null) return false;
  const y2=terrainY(x+8); if(y2===null) return true;
  return Math.abs((y2-y)/8)<0.42;
}

/* Walkable runs, derived rather than hand-listed, so any level works. A run is
   bounded by a void, by ground too steep to climb, or by a standing blockade. */
function computeRegions(){
  const T=L.terrain, x0=T[0][0], x1=T[T.length-1][0], STEP=6;
  const out=[]; let cur=null;
  for(let x=x0;x<=x1;x+=STEP){
    let ok=standable(x);
    if(ok&&L.rubble) for(const b of L.rubble){ if(!S.cleared.has(b)&&Math.abs(x-b)<26){ ok=false; break; } }
    if(ok){ if(!cur) cur=[x,x]; else cur[1]=x; }
    else if(cur){ out.push(cur); cur=null; }
  }
  if(cur) out.push(cur);
  REGIONS=out.filter(r=>r[1]-r[0]>40);
}
function regionAt(x){
  for(const r of REGIONS) if(x>=r[0]-40&&x<=r[1]+40) return r;
  let best=REGIONS[0], bd=1e9;
  for(const r of REGIONS){ const d=Math.min(Math.abs(x-r[0]),Math.abs(x-r[1])); if(d<bd){bd=d;best=r;} }
  return best||[x-10,x+10];
}

/* =============================================================== ARMORS === */
/* A project of meaning is not a place on the map. It is built from wherever you
   happen to be standing when you commit to it, and it spends a fixed number of
   moves you were never told the count of.

   The two states divide the work between them: the raw world is where you can
   see the ridge, the chasm and the peak, and therefore where the thinking has
   to happen. The armour is where you act — fast, precise, and blind to
   everything you did not look at first. */
const GRAV=2400, RUN=340, JUMP_V=-840;      // a jump that clears about 230 units
const COYOTE=0.10, BUFFER=0.13;             // forgiveness, so misses are the player's
const PLAT_W=118, PLAT_H=14;
const CLIMB_LAND=44;                        // close enough to the ground to be standing on it
const ARMOR_TIME=50;                        // fifty seconds, and about fifty things to do in them
const CLIMB_TIME=40;                        // the ladder runs on a shorter one, and shows it
/* A ladder is not a landscape. It is a narrow shaft with a great many storeys
   in it, three places to stand on each, and no way to make progress that is not
   straight up. Nothing here can be walked around. */
const CLIMB_ROWS=18, CLIMB_PER_ROW=3, ROW_H=112, SHAFT_W=560;
/* Nobody has to be told what a cut line is. It starts below the rung you are
   standing on and comes up at a fixed rate that arrives at the top at very
   nearly the moment the clock does, so the number in the corner and the dark
   rising under your feet are one fact told twice. It is why you cannot stand
   still on a ladder, and it is the only thing in here that is honest. */
const CUT_LEAD=150, CUT_HEAD=ROW_H*3.0;
const CUT_GRACE=6;                          // it holds while you find the controls
const CUT_RATE=53;                          // and then comes up at this, forever

/* The armour does not take you anywhere else. It takes the next impassable
   thing in front of you and redraws it as a game with an answer: a ladder of
   rungs, eighteen storeys of them, switching back on itself the way a career
   does. The ground it covers is one gap. The climbing is years.

   And if the next impassable thing is a very long way off — as it is for most
   of the ridge — it covers what one of these covers and no further. You can put
   one on anywhere and cross the whole level inside it, at about the speed you
   would have walked, seeing none of it. Nothing stops you. */
const ARMOR_REACH=1200;
function nextObstacle(x0){
  const edge=regionAt(x0)[1];
  let exit=null;
  for(let x=edge+8;x<edge+3200;x+=8){
    if(terrainY(x)!==null&&standable(x)){ exit=x; break; }
  }
  return {edge,exit};
}
function buildClimbCourse(x0,y0,assist){
  assist=assist||0;
  const {edge,exit}=nextObstacle(x0);
  const gx=Math.min(exit===null?edge+900:exit+46,x0+ARMOR_REACH), gy=terrainYSafe(gx);
  // seeded off where you committed, so the same place always gives the same
  // ladder, and no two places give the same one
  const r=mulberry32(Math.round(x0*7.13)+911);
  const out=[{x:x0,y:y0,w:PLAT_W*1.3,row:0,anchor:true}];
  // Every time it drops you, the ladder puts out another rung. It is not being
  // kind. A project that let you fall all the way out of it would stop being a
  // project, and this one has no intention of losing you.
  const per=CLIMB_PER_ROW+Math.min(2,Math.floor(assist/2));
  const wide=1+Math.min(0.40,assist*0.09);
  // the shaft does not get wider when it gets busier; the rungs just crowd in
  const gapx=SHAFT_W/per;
  // A ground floor, so that missing a rung costs you storeys rather than
  // everything. There is only one way to lose in here and it comes from below.
  for(let i=0;i<per;i++) out.push({x:x0+(i+0.6)*gapx,y:y0,w:gapx+10,row:0,ground:true});
  for(let row=1;row<=CLIMB_ROWS;row++){
    // every storey is offset half a stride from the one below it, so there is
    // always something one jump overhead and never anything level with you
    const off=(row%2)*gapx*0.5;
    /* Two places where a ladder narrows. The middle of it, where most of
       everybody stops — two rungs, both of them swinging, and the only way past
       is to stand still and wait for one of them to come to you. And the last
       storey before the thing you were promised, where they get thin. */
    const pinch=(row===6||row===13);
    const n=pinch?Math.min(per,2+Math.floor(assist/2)):per;
    const stride=pinch?SHAFT_W/n:gapx;
    for(let i=0;i<n;i++){
      // and they get smaller the higher you go, because they do
      const taper=lerp(0.62,0.33,(row-1)/(CLIMB_ROWS-1));
      const p={x:x0+(pinch?0:off)+(i+0.25)*stride+(r()-0.5)*14,
               y:y0-row*ROW_H+(r()-0.5)*12,
               w:PLAT_W*taper*lerp(0.88,1.12,r())*wide,row};
      // an opening that is only there sometimes is still, technically, an opening
      if(pinch){ p.drift=rr(58,80); p.dsp=rr(0.5,0.8); p.dph=i*2.4; }
      else if(row>=4&&r()<0.26-assist*0.035){
        p.drift=rr(22,40); p.dsp=rr(0.55,1.05); p.dph=r()*6.283;
      }
      out.push(p);
    }
  }
  // and the way out sits directly over the last storey
  const top=out[out.length-1];
  out.push({x:top.x,y:top.y-ROW_H,w:PLAT_W*1.5,row:CLIMB_ROWS+1,exit:true});
  out.goal={x:gx,y:gy};
  out.cx=x0+SHAFT_W*0.5;                    // the shaft holds still; you go up it
  // the very first one waits longer, because the very first one is also where
  // you are working out that the arrow keys do anything at all
  out.grace=CUT_GRACE+(assist===0?5:0);
  out.floor0=y0+CUT_LEAD;                   // where the cut line starts, just under you
  out.floorTo=top.y-ROW_H+CUT_HEAD;         // and where it has got to when the clock does
  out.floor=out.floor0;                     // below this there is no more ladder
  return out;
}
function courseTime(assist){ return Math.min(66,CLIMB_TIME+(assist||0)*6); }
/* Where the cut line has got to. It waits, and then it comes up at one steady
   rate and never stops, so that the extra seconds a failed attempt buys you are
   really extra rather than the same climb stretched out. */
function climbFloor(){
  const C=S.course;
  if(!C||C.floor0===undefined) return 1e9;
  // it waits under the first rung long enough for you to work out the controls,
  // and then it starts, and then it does not stop
  const el=S.armTMax-S.armT, gr=C.grace===undefined?CUT_GRACE:C.grace;
  return Math.max(C.floorTo,C.floor0-CUT_RATE*Math.max(0,el-gr));
}
/* A rung that drifts is at platX(p), not at p.x. Everything that touches one
   — landing on it, drawing it, being carried by it — has to ask. */
function platX(p){ return p.drift?p.x+Math.sin(S.t*p.dsp+p.dph)*p.drift:p.x; }

/* The clock running out is not a scripted dead end. It is you, still out over
   the drop, with the thing that was holding you up no longer holding. */
function armorFails(){
  if(S.transition||S.mode!=='armored') return;
  // In the opening, failing is not a way out. See openingTear.
  if(S.opening==='ladder'){ openingTear(); return; }
  S.ceilingFlash=1; say('wall',ARMORS[S.armor].key); vibrate([12,60,12]);
  shatter(false);
}
/* And arriving is the opposite: it sets you down on the real ledge, at very
   nearly the altitude you started from, however many storeys you climbed. */
function armorArrives(goal){
  if(S.transition) return;
  if(goal){ player.x=goal.x; player.y=goal.y; player.vx=0; player.vy=0; }
  // the one rung marked THE NEXT LEVEL, and what is actually on the far side
  if(S.opening==='ladder'){ S.opening='reveal'; S.openDone=true; S.hint=''; S.hintA=0; }
  shatter(true);
}

/* The Routine is not a puzzle. It is a tempo, and a question about when to
   stop. Behind the amber filter the world becomes a staircase and a metronome
   and nothing else: you put your foot down on the beat, and the ground you
   cannot see goes by underneath at its own rate.

   A habit has no idea where it is. It works exactly as well over the ledge you
   were aiming for as it does over the drop past it, and it will carry you
   cheerfully off the end. Step off too early and the slope you were stairing
   over takes you back down. Step off in the window and you are standing on the
   ledge. Step off late — or let it run to its own end — and there is nothing
   under you. The only way to know is to listen to your own footsteps. */
const STAIR_DX=72, STAIR_DY=-26;          // how a step looks, not how far it goes
const STAIR_STEPS=48;                      // how many mornings this one has in it
const BEAT_SLOW=0.86, BEAT_FAST=0.52;     // the years ask for it faster
const WIN_GOOD=0.13, WIN_OK=0.24;         // on the beat, near enough, and not
const STUMBLE_COST=1.3;

function buildRoutine(x0){
  const {edge,exit}=nextObstacle(x0);
  const gx=Math.min(exit===null?edge+700:exit+40,x0+ARMOR_REACH);
  // it means to cover that ground in about forty mornings. It does not stop
  // there, because stopping is not something a routine knows how to do.
  S.stride=clamp((gx-x0)/40,6,46);
  S.routineLeft=STAIR_STEPS; S.cadence=0; S.stumbles=0;
  S.beatDur=BEAT_SLOW; S.beatT=BEAT_SLOW; S.beatHit=0; S.stepAnim=1; S.stepLock=0;
  return [{vx:0,vy:0,ground:standable(x0)}];
}
// how far from the nearest beat you are, in seconds
function routineBeatOff(){ return Math.min(S.beatT,S.beatDur-S.beatT); }
// whether there is anything under this morning — never shown, only heard
function routineOnGround(){ return terrainY(player.x)!==null&&standable(player.x); }

function routineStep(){
  if(S.mode!=='armored'||S.armor!=='routine'||S.transition) return;
  if(S.routineLeft<=0) return;
  // A day is a day. Pressing four times inside one beat does not buy you four
  // mornings, and a habit you can hurry is not the thing this is about.
  if(S.stepLock>0) return;
  const off=routineBeatOff();
  if(off>WIN_OK){
    // out of time with yourself: the step does not happen and the day is longer
    S.stumbles++; S.cadence=0; S.armT=Math.max(0,S.armT-STUMBLE_COST);
    S.stepLock=S.beatDur*0.34;
    S.ceilingFlash=0.7; SFX.smash(false); vibrate([20]);
    return;
  }
  S.stepLock=S.beatDur*0.62;
  const clean=off<=WIN_GOOD;
  const n=S.routineTrack[S.routineTrack.length-1];
  // the world goes by underneath at its own rate, whatever the stairs look like
  player.x+=S.stride; player.y=terrainYSafe(player.x);
  const ground=routineOnGround();
  S.routineTrack.push({vx:n.vx+STAIR_DX,vy:n.vy+STAIR_DY,ground});
  if(S.routineTrack.length>40) S.routineTrack.shift();
  S.routineIdx++; S.routineLeft--; S.stepAnim=0;
  S.cadence=clean?S.cadence+1:0;
  S.beatHit=clean?1:0.55;
  // the tell, and the only one: a morning over ground and a morning over
  // nothing do not sound the same, if you are still listening
  if(ground) SFX.wood(); else SFX.tick(false);
  vibrate(clean?6:11);
  if(S.routineLeft<=0) routineStops();
}
function routineStops(){
  if(S.routineEnd) return;
  S.routineEnd=true; S.stranded=true; S.ceilingFlash=1; vibrate([8,40,8]);
}
function routineArrived(){ return false; }   // arriving is now your call, not its

/* ---------------------------------------------------------- THE DOGMA ---
   Speed and destruction. Everything ahead sorts into Pure and Corrupt, and the
   Corrupt can simply be smashed. One of the things you smash was holding up
   the road. */
/* A cause does not pick its way down a road. It goes flat out, in a straight
   line, and removes what is in front of it — and the faster it goes the better
   it works, right up to the speed at which it can no longer see what it is
   removing. That is the entire game in here: hold the line, hit the thing in
   front of you, do not stop. Nothing on this screen will tell you what any of
   it was, and the count at the end arrives after it is all already down. */
const DOG_V0=180, DOG_VMAX=575, DOG_ACC=58;
const DOG_GAIN=46;            // what one clean hit is worth
const DOG_WIN=125;            // how far ahead of you a swing connects
const DOG_WHIFF=150, DOG_FLOOR=115;   // what swinging at nothing costs, and the
                              // speed below which even that cannot take you
const DOG_STALL=1.05;         // seconds face-down after going into one
const DOG_TIME=30;
function buildDogma(x0){
  const out=[], end=(L.exposed?L.exposed.x0:L.goalX+40);
  if(L.rubble) for(const b of L.rubble){
    if(b<=x0+80||b>end) continue;
    if(!S.cleared.has(b)) out.push({x:b,dead:false});
  }
  S.dogV=DOG_V0; S.dogStall=0; S.dogHits=0; S.dogSlams=0; S.dogSwing=0;
  S.dogEnd=end; S.dogSwingReq=false; S.dogFlash=0;
  S.armTMax=DOG_TIME; S.armT=DOG_TIME;
  return out;
}
// the only verb it has
function dogmaSwing(){
  if(S.mode!=='armored'||S.armor!=='dogma'||S.transition||S.stranded) return;
  S.dogSwingReq=true;
}

/* --------------------------------------------------------- THE REFUGE ---
   A warm ring containing you and one other. Inside it there is no dread at all.
   The companion has a lifespan, and is not told to you. */
function buildRefuge(x0){
  const runs=[];
  // how far the companion can walk before its light goes out
  S.thread=REFUGE_SLACK; S.refugeNear=true; S.refugeD=0;
  return {x:x0+56,y:terrainYSafe(x0+56),life:REFUGE_LIFE,max:REFUGE_LIFE,
          gone:false,ph:rr(0,6.283),vx:60};
}
// how much of the ring is left. Nothing else ever says.
function refugeRing(){
  const C=S.companion;
  return lerp(REFUGE_R1,REFUGE_R0,C?clamp(C.life/C.max,0,1):0);
}
const COLLAPSE_DUR=3.0;       // seconds on your knees, and not one you can skip
/* Walking is the one thing that helps, and it helps less the longer you have
   been doing it. The pressure is not behind you, so you cannot walk away from
   it; somewhere around the minute mark it stops mattering how fast you are
   going. Then you go down, and you get up, and it starts again.

   Putting an armour on is the only thing that sets the clock back to nothing.
   That is the whole offer, and it is also the whole cost: the same ridge, at
   the same speed, with none of it visible. */
const EXPOSE_FULL=46;         // seconds before walking has stopped buying anything
const EXPOSE_RATE=0.085;      // and what being out in the open costs by then
/* Every project of meaning costs you something in lucidity, and the ones that
   break under you cost more. The floor is what you can no longer get below —
   each illusion leaves you a little harder to fool, which is the arc. */
const FLOOR_BASE=0.16, FLOOR_EQUIP=0.04, FLOOR_BREAK=0.10, FLOOR_CAP=0.46;
const lived=new Set();        // armours you have worn: you learn a reach by living it
/* The ring is not drawn around you. It is drawn around somebody else, and it
   moves at their speed, which is not steady and was never yours to set. Inside
   it the ground is lit and nothing is dying. Outside it there is no ground at
   all, and a thread between you that only has so much give.

   The ring closes as their life runs down, which is the only way you are ever
   told how much of it is left. */
const REFUGE_LIFE=30;         // seconds of company, hidden from the player
const REFUGE_R0=330, REFUGE_R1=112;   // the ring at the start, and at the end
const REFUGE_SLACK=4.0;       // seconds of thread, once you are outside it
const REFUGE_V=142;           // what you can do. Not what they do.

/* ------------------------------------------------------- THE CREATION ---
   You draw the ground you walk on, in gold, over nothing. It holds while the
   paint is wet. There is a finite amount of paint and you are not told how much. */
/* You get one line and a fixed amount of it, and the far side of the hall is
   higher than this one. Steer it flat and you arrive under the ledge with paint
   in hand and nowhere to put it; steer it steep and you run out over the middle
   of the room. And it dries from the far end back towards you, so there is no
   standing still on your own work and no going back over it either. */
const PAINT_TOTAL=1250;       // world units of line, hidden from the player
const PAINT_DRY=8.0;          // seconds before a drawn span goes brittle
const CREATE_V=118;           // how fast a line goes down
const CREATE_ANG=0.62;        // and how steeply you are allowed to want it

/* -------------------------------------------------------- THE ARCHIVE ---
   Every gap becomes an angle. Solve it, jump it, land. Until a gap whose
   solution does not exist. */
/* Reason will do the sum for you. It will not do it wrong, and it will not do
   it for a distance it cannot reach, and it never once says which of those two
   it is up against. The aim sweeps; you stop it where you think; it draws you
   the arc it computed and puts you exactly there. Getting it wrong does not
   drop you — it simply makes you do the sum again, faster, with less left. */
const ARCH_V=760, ARCH_G=1500;
const ARCH_SWEEP=0.80, ARCH_SWEEP_ERR=0.08;   // radians a second, and per mistake
const ARCH_LO=0.20, ARCH_HI=1.46;             // the angles it is willing to consider
const ARCH_TIME=60, ARCH_MISS=2.5;
const ARCH_SPAN=210;
// the furthest a fixed launch speed will ever carry, which is not a matter of
// opinion and is the whole of the ending of this one
const archRange=()=>ARCH_V*ARCH_V/ARCH_G;
function buildArchive(x0){
  const y0=terrainYSafe(x0);
  const out=[{x:x0,y:y0,w:120,ok:true}];
  const {edge,exit}=nextObstacle(x0);
  const far=(exit===null?edge+2400:exit);
  const r=mulberry32(Math.round(x0*5.9)+229);
  const R=archRange();
  const endX=far+46, endY=terrainYSafe(endX);
  let x=x0, y=y0, i=0;
  while(i<40){
    const rem=endX-x;
    if(rem<=R*0.80) break;
    const k=clamp((x-x0)/Math.max(1,endX-x0),0,1);
    // the sums get longer and the answers get narrower
    let dx=lerp(215,R*0.80,k)*lerp(0.95,1.05,r());
    if(rem-dx<180) dx=rem-180;
    if(dx<150) break;
    const cand={x:x+dx,y:lerp(y0,endY,k)-lerp(34,116,Math.abs(Math.sin(i*1.7))),
                w:lerp(132,94,k),ok:true};
    // it never sets down a sum it cannot do. That is its entire reputation.
    let guard=0;
    while(guard++<14&&!archReachable(out[out.length-1],cand)) cand.x-=24;
    out.push(cand); x=cand.x; y=cand.y; i++;
  }
  // the far side of the hall, in stone, which is where it lets you off
  out.push({x:endX,y:endY,w:150,ok:true,ground:true});
  // and one more, set down at a distance no angle it will consider answers
  out.push({x:endX+R*1.42,y:endY-80,w:88,ok:false});
  S.archAng=ARCH_LO; S.archDir=1; S.archErr=0; S.archShort=0;
  S.armTMax=ARCH_TIME; S.armT=ARCH_TIME;
  return out;
}
/* Where a launch at this angle actually comes down, from where you are, given
   that the next thing along may be higher or lower than you are. */
function archSolve(ang,from,to){
  const vx=Math.cos(ang)*ARCH_V, vy=-Math.sin(ang)*ARCH_V;
  const dy=to.y-from.y;                       // +y is down
  const disc=vy*vy+2*ARCH_G*dy;
  if(disc<0) return null;
  const t=(-vy+Math.sqrt(disc))/ARCH_G;
  return {t,x:from.x+vx*t};
}

const ARMORS={
  climb:{name:'THE CLIMB',theme:'CAREER & STATUS',glyph:'▲',dir:'up',
         key:P.climb.cyan,dark:'#000000',zoom:0.82},
  routine:{name:'THE ROUTINE',theme:'HABIT & STRUCTURE',glyph:'■',dir:'down',
         key:P.routine.amber,dark:P.routine.dark},
  dogma:{name:'THE DOGMA',theme:'IDEOLOGY & CAUSE',glyph:'◄',dir:'left',
         key:'#E63946',dark:'#050505'},
  refuge:{name:'THE REFUGE',theme:'FAMILY & KIN',glyph:'►',dir:'right',
         key:'#FB8500',dark:'#0F0D0E'},
  creation:{name:'THE CREATION',theme:'ART & MONUMENT',glyph:'✦',dir:'up',
         key:'#FFD700',dark:'#08040C',sub:'#7B2CBF'},
  archive:{name:'THE ARCHIVE',theme:'LOGIC & KNOWLEDGE',glyph:'◆',dir:'down',
         key:'#00FF66',dark:'#020E0A',sub:'#003B19'}
};
// which slot on the wheel each armour occupies, per level
const WHEEL_SLOTS={climb:'up',routine:'down',dogma:'left',refuge:'right',
                   creation:'up',archive:'down'};

/* ---------------------------------------------------------- THE SHORE ---
   The last level has no armour, so it has no track, no nodes and no fuel. It
   has a tempo. The water breathes; you either move with it or you fight it,
   and fighting it is the only thing on this level that costs you anything. */
const BEAT=2.6;               // seconds per breath of the water
const BEAT_OPEN=0.46;         // the part of the breath that carries you forward
const CALM_GAIN=0.52, CALM_LOSS=0.64;
const CALM_HOLD=0.03, CALM_STILL=0.5;   // standing still settles you, but only so far
const PUSH_BACK=0.30;                   // what pushing against the water is worth
const MONO_W=190, MONO_H=430; // the obsidian mirror at the middle of the shore
const ZOOM_SKY=3.9;           // how far the camera rises at the end
const EPI_LINE=6.2;           // seconds each closing line is held
const beatPhase=()=>((S.t/BEAT)%1+1)%1;
const withWater=()=>beatPhase()<BEAT_OPEN;

/* ================================================================ STATE === */
const S={
  screen:'title',        // title | play | complete
  mode:'lucid',          // lucid | armored
  armor:null,
  unlocked:new Set(),    // armors offered on the wheel
  t:0, dt:0, wall:0,

  grace:0,               // and the numb stretch afterwards, where nothing lands
  lucidStreak:0,

  transition:null,
  wheelOpen:false, wheelSel:null, wheelT:0,
  climbTrack:[], climbIdx:0, climbDash:null, deadEnd:false, deadEndT:0, climbLeft:0,
  routineTrack:[], routineIdx:0, routineDash:null, routineCadence:0, routineEnd:false, routineLeft:0,
  beatDur:0.8, beatT:0, beatHit:0, beatHeld:false, cadence:0, stumbles:0, stepLock:0,
  floor:0.16,            // the pressure you can no longer get below on this level
  worn:0, broken:0,      // illusions this crossing took, and how many gave way
  stranded:false, strandT:0,
  levelIdx:0, cleared:new Set(), interT:0,
  companion:null, paint:1, trail:[], aim:null, thread:0, refugeNear:true, refugeD:0,
  paintAng:0, paintGoal:0, paintFrom:0, paintLand:0,
  archAng:0.2, archDir:1, archErr:0, archShort:0, archIdx:0, archUndef:false, archTrack:[],
  dogmaTrack:[], dogmaIdx:0, dogmaDash:null,
  dogV:0, dogStall:0, dogHits:0, dogSlams:0, dogSwing:0, dogFlash:0, dogSwingReq:false, dogEnd:0,

  /* Level one does not start in the world. See enterOpening. */

  ceilingFlash:0,

  sunT:0,
  /* the shore: an act, a tempo, and how much you have stopped resisting */
  act:'', actT:0, calm:0, lastBeat:-1, wheelSeen:false,
  choiceSel:null, crack:0, flood:0, light:0, dim:0, epiI:-1, epiT:0,
  zt:0, camK:2.4, wide:false
};

const player={x:-120,y:0,vx:0,tremor:0,facing:1,kneel:0};
player.y=terrainYSafe(player.x);

const cam={x:0,y:0,tx:0,ty:0};
function camTarget(){
  // The closing shot stops leading the walker anywhere and simply holds them,
  // small, in the middle of everything.
  if(S.wide){ cam.tx=player.x-VIEW_W*0.5; cam.ty=player.y-VIEW_H*0.54; return; }
  // The reveal: framed on the gap first — the one thing nine storeys of ladder
  // were drawn on top of — and only afterwards on the person standing past it.
  if((S.revealT>0||S.opening==='reveal')&&L.coldOpen){
    // held wide for the whole dissolve, so the frame is already on the ridge by
    // the time there is enough of it to see
    const k=S.opening==='reveal'?0:smooth(inv(REVEAL_LOCK,REVEAL_HOLD,REVEAL_HOLD-S.revealT));
    const gap=L.gaps[0], mid=(gap.x0+gap.x1)/2;
    // the whole gap in frame, and the one who crossed it small over on the right
    cam.tx=lerp(lerp(mid,player.x,0.25)-VIEW_W*0.5,player.x-VIEW_W*0.29,k);
    cam.ty=lerp(terrainYSafe(player.x)-VIEW_H*0.60,player.y-VIEW_H*0.62,k);
    return;
  }
  // in the jumping game the frame holds the rungs still and lets you move in it,
  // rather than chasing every hop
  if(S.mode==='armored'&&S.armor==='climb'&&S.baseY!==undefined){
    const cx=(S.course&&S.course.cx!==undefined)?S.course.cx:player.x;
    cam.tx=cx-VIEW_W*0.5; cam.ty=S.baseY-VIEW_H*0.70; return;
  }
  // the arc goes up; the frame has to leave room over the pad you launched from
  if(S.mode==='armored'&&S.armor==='archive'&&S.archTrack.length){
    const a=S.archTrack[S.archIdx]||{y:player.y};
    cam.tx=player.x-VIEW_W*0.34; cam.ty=a.y-VIEW_H*0.72; return;
  }
  // Unarmored looks further ahead — you can see where you are going, and how far.
  cam.tx=player.x-VIEW_W*(S.mode==='armored'?0.40:0.29);
  cam.ty=player.y-VIEW_H*(S.mode==='armored'?0.66:0.62);
}
/* The one shot the whole game is built to pay off: the blinders come off for
   the first time and the frame opens on what was behind them. It opens in one
   continuous movement — the aperture of the armour, then the gap and the person
   who crossed it, then the whole width the unarmoured state normally sees — and
   it is held still, and for a few seconds nothing is asked of the player except
   that they look at it. (Zoom here is view height: larger sees more.) */

const INTRO_DUR=5.6, INTRO_HOLD=2.1;

camTarget(); cam.x=cam.tx; cam.y=cam.ty;

const fired=new Set();

const PR_IN=1.7, PR_HOLD=3.0, PR_OUT=1.4;

function say(id,tint){

  fired.add(id);

function updatePrompts(dt){
  if(!activePrompt&&promptQ.length) activePrompt=promptQ.shift();

function promptAlpha(p){
  if(p.t<PR_IN) return smooth(p.t/PR_IN)*0.6;
  if(p.t<PR_IN+PR_HOLD) return 0.6;
  return 0.6*(1-smooth((p.t-PR_IN-PR_HOLD)/PR_OUT));

function mkNoise(actx,sec,brown){
  const buf=actx.createBuffer(1,actx.sampleRate*sec,actx.sampleRate);
  const d=buf.getChannelData(0); let last=0;
  for(let i=0;i<d.length;i++){
    const w=Math.random()*2-1;
    if(brown){ last=(last+0.02*w)/1.02; d[i]=last*3.2; } else d[i]=w;
  }
  return buf;
}
function audioStart(){
  if(AU.ready) return;

  if(!AC) return;
  const a=new AC(); AU.ctx=a; AU.ready=true;

  AU.master=a.createGain(); AU.master.gain.value=0.9; AU.master.connect(a.destination);
  AU.lucidBus=a.createGain(); AU.lucidBus.gain.value=0.0; AU.lucidBus.connect(AU.master);
  AU.armorBus=a.createGain(); AU.armorBus.gain.value=0.0; AU.armorBus.connect(AU.master);
  AU.noiseBuf=mkNoise(a,3,false);

  /* --- unarmored bed: 35–80Hz rumble + airy wind + heavy minor drone ----- */
  const brown=mkNoise(a,5,true);
  const rumbleSrc=a.createBufferSource(); rumbleSrc.buffer=brown; rumbleSrc.loop=true;
  const rumbleF=a.createBiquadFilter(); rumbleF.type='lowpass'; rumbleF.frequency.value=80; rumbleF.Q.value=0.7;
  const rumbleG=a.createGain(); rumbleG.gain.value=0.55;
  rumbleSrc.connect(rumbleF).connect(rumbleG).connect(AU.lucidBus); rumbleSrc.start();
  AU.windLo=rumbleG;

  const airSrc=a.createBufferSource(); airSrc.buffer=mkNoise(a,4,false); airSrc.loop=true;
  const airF=a.createBiquadFilter(); airF.type='bandpass'; airF.frequency.value=620; airF.Q.value=0.6;
  const airG=a.createGain(); airG.gain.value=0.05;
  airSrc.connect(airF).connect(airG).connect(AU.lucidBus); airSrc.start();
  AU.windHi=airG;
  // slow gusting
  const gust=a.createOscillator(); gust.frequency.value=0.07;
  const gustG=a.createGain(); gustG.gain.value=0.035;
  gust.connect(gustG).connect(airG.gain); gust.start();

  [32.7,49.0,77.78].forEach((f,i)=>{ // C1 G1 Eb2 — unresolved, heavy
    const o=a.createOscillator(); o.type=i===2?'triangle':'sine'; o.frequency.value=f;
    const g=a.createGain(); g.gain.value=[0.16,0.10,0.05][i];
    const lfo=a.createOscillator(); lfo.frequency.value=0.05+i*0.017;
    const lg=a.createGain(); lg.gain.value=f*0.004;
    lfo.connect(lg).connect(o.frequency); lfo.start();
    // kept as nodes, not just gains: the last level has to retune this chord
    o.connect(g).connect(AU.lucidBus); o.start(); AU.drone.push({o,g});
  });

}
function env(node,t0,peak,atk,dec){
  node.gain.cancelScheduledValues(t0);
  node.gain.setValueAtTime(0.0001,t0);
  node.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t0+atk);
  node.gain.exponentialRampToValueAtTime(0.0001,t0+atk+dec);
}
function blip(freq,type,peak,atk,dec,dest,when){
  if(!AU.ready) return;
  const a=AU.ctx,t0=(when||a.currentTime);
  const o=a.createOscillator(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  const g=a.createGain(); env(g,t0,peak,atk,dec);
  o.connect(g).connect(dest||AU.master); o.start(t0); o.stop(t0+atk+dec+0.05);
  return o;
}
function noiseHit(peak,dur,filt,freq,Q,dest,when){
  if(!AU.ready) return;
  const a=AU.ctx,t0=(when||a.currentTime);
  const s=a.createBufferSource(); s.buffer=AU.noiseBuf;
  s.playbackRate.value=0.8+Math.random()*0.5;
  const f=a.createBiquadFilter(); f.type=filt||'bandpass'; f.frequency.value=freq||1200; f.Q.value=Q||1;
  const g=a.createGain(); env(g,t0,peak,0.004,dur);
  s.connect(f).connect(g).connect(dest||AU.master); s.start(t0); s.stop(t0+dur+0.1);
  return f;
}

function audioTick(dt){
  if(!AU.ready) return;
  const a=AU.ctx, tc=0.25;
  let wantLucid=(S.mode==='lucid'||(S.transition&&S.transition.type==='shatter'&&S.transition.t>0.3))?1:0.06;
  // and through a tear it comes in further each time, which is how most people
  // find out there is anything on the other side of what they are doing
  if(S.tear) wantLucid=Math.max(wantLucid,0.14+0.15*S.tear.g);
  AU.lucidBus.gain.setTargetAtTime((AU.on?1:0)*wantLucid*(S.screen==='title'?0.35:1),a.currentTime,tc);
  AU.armorBus.gain.setTargetAtTime((AU.on?1:0)*(S.mode==='armored'?1:0.0),a.currentTime,0.08);
  // on the shore the rumble is the same threat it always was, until you stop
  // bracing against it, at which point it is just weather
  const ease=L.shore?1-0.45*S.calm:1;
  if(AU.windLo) AU.windLo.gain.setTargetAtTime((0.34+S.dread*0.55)*ease,a.currentTime,0.6);
  if(AU.windHi) AU.windHi.gain.setTargetAtTime((0.035+S.dread*0.05)*ease,a.currentTime,0.6);

  if(S.screen==='play'&&S.mode==='lucid'&&AU.on){
    AU.heart-=dt;
    if(AU.heart<=0){
      SFX.heart(L.shore?S.dread*0.55:S.dread);
      // the pulse slows to the tempo of the water rather than racing it
      AU.heart=L.shore?lerp(1.5,BEAT,S.calm):lerp(1.55,0.62,S.dread);
    }
  }
  if(S.screen==='play'&&S.mode==='armored'&&AU.on){
    AU.tick-=dt;
    if(AU.tick<=0){
      // the ladder's clock: the metronome tightens as the quarter runs out
      if(S.armor==='climb'){ SFX.tick(S.armT>6); AU.tick=clamp(S.armT*0.055,0.16,0.5); }
      else if(S.armor==='routine'){ SFX.tick(true); AU.tick=0.5; }  // metronome
      else if(S.armor==='dogma'){ SFX.smash(false); AU.tick=0.32; } // industrial pulse
      else if(S.armor==='refuge'){ SFX.pluck(); AU.tick=2.0; }      // 60 BPM warmth
      else if(S.armor==='creation'){ SFX.brush(); AU.tick=0.42; }   // brush strokes
      else { SFX.ping(); AU.tick=0.66; }                             // calculation pings
    }
  }
  if(S.screen==='play'&&S.mode==='lucid'&&AU.on){
    AU.cello=(AU.cello||6)-dt;
    if(AU.cello<=0){ SFX.cello(); AU.cello=rr(15,24); }
  }
}

const keys=new Set();
const ptr={down:false,x:0,y:0,sx:0,sy:0,moved:0};
const touches=new Map();
let lastTapT=-9, lastTapX=0, lastTapY=0;
let usedMove=false, usedWheel=false;

function toView(e){ const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*VIEW_W, y:(e.clientY-r.top)/r.height*VIEW_H}; }

function beginPlay(){
  audioStart();
  if(S.screen==='title'){ S.screen='play'; loadLevel(0); }
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  const v=toView(e);
  touches.set(e.pointerId,{...v,t:S.wall});
  if(S.screen==='title'){ beginPlay(); return; }
  if(S.screen==='interstitial'){ if(S.interT>1.2) nextLevel(); return; }
  if(S.screen==='complete') return;
  audioStart();
  if(S.intro>0){ skipIntro(); return; }

  // the only question the game ever asks you
  if(S.act==='ask'){ const c=choiceHit(v); if(c) chooseMirror(c==='yes'); return; }

  if(e.button===2){ if(S.mode==='lucid') openWheel(v); return; }

  // double-tap / double-click -> step off the armour. Not in the opening: in
  // there every tap is a jump, and there is nothing to step off onto.
  if(S.opening!=='ladder'){
    const dt=S.wall-lastTapT, dd=Math.hypot(v.x-lastTapX,v.y-lastTapY);
    if(dt<0.34&&dd<70){ lastTapT=-9; stripAway(); return; }
    lastTapT=S.wall; lastTapX=v.x; lastTapY=v.y;
  }

  if(touches.size>=2&&S.mode==='lucid'){ openWheel(v); return; }

  ptr.down=true; ptr.x=v.x; ptr.y=v.y; ptr.sx=v.x; ptr.sy=v.y; ptr.moved=0;
  document.body.classList.add('dragging');

  if(S.mode==='armored'&&!S.transition){
    armorTap();
  }
},{passive:true});

cv.addEventListener('pointermove',e=>{
  const v=toView(e);
  if(touches.has(e.pointerId)) touches.set(e.pointerId,{...v,t:S.wall});
  if(ptr.down){ ptr.moved+=Math.hypot(v.x-ptr.x,v.y-ptr.y); ptr.x=v.x; ptr.y=v.y; }
  if(S.wheelOpen) updateWheelSel(v);
},{passive:true});

function endPointer(e){
  touches.delete(e.pointerId);
  if(S.wheelOpen&&touches.size===0){ commitWheel(); }
  if(touches.size===0){ ptr.down=false; document.body.classList.remove('dragging'); }
}
cv.addEventListener('pointerup',endPointer,{passive:true});
cv.addEventListener('pointercancel',endPointer,{passive:true});
cv.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  if(e.repeat){ return; }
  const k=e.key.toLowerCase();
  if(S.screen==='title'){ beginPlay(); e.preventDefault(); return; }
  if(S.screen==='interstitial'){ if(S.interT>1.2) nextLevel(); e.preventDefault(); return; }
  keys.add(k);
  if(S.intro>0&&k!=='m'&&k!=='h'){ skipIntro(); return; }
  if(S.act==='ask'){ if(k==='y') chooseMirror(true); else if(k==='n') chooseMirror(false); }
  // the wheel latches the direction on the press. Polling held keys once a
  // frame drops a quick tap, and dropping it looks exactly like a dead game.
  if(S.wheelOpen){
    if(k==='arrowup'||k==='w') S.wheelSel=armorInSlot('up');
    else if(k==='arrowdown'||k==='s') S.wheelSel=armorInSlot('down');
    else if(k==='arrowleft') S.wheelSel=armorInSlot('left');
    else if(k==='arrowright') S.wheelSel=armorInSlot('right');
  }
  if(k===' '||k==='spacebar'){
    e.preventDefault();
    if(S.mode==='lucid'&&!S.transition&&S.screen==='play') openWheel(null);
    else armorTap();
  }
  if(k==='arrowup'||k==='w'){ if(S.mode==='armored') jumpPressed(); }
  if(k==='escape'||k==='q'){ stripAway(); }
  if(k==='m'){ AU.on=!AU.on; }
  if(k==='r'&&S.screen==='play'&&!S.transition){ S.fadeTarget=1; S.restarting=true; }
  if(k==='h'||k==='?'){ S.showHelp=!S.showHelp; }
  if(S.mode==='armored'&&!S.transition){
    // the climb and the routine read held keys in the update loop instead, so
    // that they can offer two answers rather than one
    if(k==='arrowright'||k==='d'){
      if(S.armor==='dogma'||S.armor==='archive') armorTap();
    }
  }
},{passive:false});
window.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  keys.delete(k);
  if((k===' '||k==='spacebar')&&S.wheelOpen) commitWheel();
});
window.addEventListener('blur',()=>{keys.clear();ptr.down=false;touches.clear();});

/* --------------------------------------------------------- armor wheel --- */
function openWheel(v){
  // Deliberately available while you are on your knees. Being unable to move is
  // exactly the moment a person reaches for something to put between them and
  // the world; refusing them the wheel there would be refusing them the game.
  if(S.mode!=='lucid'||S.transition||S.falling||S.intro>0) return;
  // and not while the reveal is still being looked at
  if(S.revealT>REVEAL_HOLD-REVEAL_LOCK) return;
  // once the shore has asked its question, the habit is no longer available
  if(L.shore&&S.act!=='wake'&&S.act!=='walk'&&S.act!=='mirror') return;
  S.wheelOpen=true; S.wheelT=0; S.wheelSel=null; usedWheel=true;
  // The level's first armour is always available; later ones unlock by enduring.
  // On the ridge both are offered from the start: choosing between them, and
  // choosing where to stand when you do, is the whole of the game there.
  // On the shore there is no first armour, and the habit of reaching for one is
  // exactly what the level is about.
  if(L.proto) L.armors.forEach(a=>S.unlocked.add(a));
  else if(L.armors[0]) S.unlocked.add(L.armors[0]);
  else S.wheelSeen=true;
  if(v) updateWheelSel(v);
}
function updateWheelSel(v){
  if(!S.wheelOpen) return;
  const cx=VIEW_W/2, cy=VIEW_H/2;
  const dx=v.x-cx, dy=v.y-cy, d=Math.hypot(dx,dy);
  if(d<52){ S.wheelSel=null; return; }
  const ang=Math.atan2(dy,dx);
  let dirn;
  if(ang<-Math.PI*0.75||ang>Math.PI*0.75) dirn='left';
  else if(ang<-Math.PI*0.25) dirn='up';
  else if(ang<Math.PI*0.25) dirn='right';
  else dirn='down';
  S.wheelSel=armorInSlot(dirn);
}
function commitWheel(){
  if(!S.wheelOpen) return;
  S.wheelOpen=false;
  const sel=S.wheelSel; S.wheelSel=null;
  if(sel&&S.unlocked.has(sel)) equip(sel);
}
// keyboard selection while the wheel is held
function armorInSlot(dirn){
  const own=L.armors.find(k=>WHEEL_SLOTS[k]===dirn);
  if(own) return own;
  return Object.keys(ARMORS).find(k=>WHEEL_SLOTS[k]===dirn&&!L.armors.includes(k))||null;
}
function wheelKeys(){
  if(!S.wheelOpen) return;
  if(keys.has('arrowup')||keys.has('w')) S.wheelSel=armorInSlot('up');
  if(keys.has('arrowdown')||keys.has('s')) S.wheelSel=armorInSlot('down');
  if(keys.has('arrowleft')) S.wheelSel=armorInSlot('left');
  if(keys.has('arrowright')) S.wheelSel=armorInSlot('right');
}

/* ============================================================ TRANSITIONS = */
const EQUIP_DUR=0.7, SHATTER_DUR=1.2, DISSOLVE_DUR=2.0;

function equip(which){
  if(S.transition) return;
  S.transition={type:'equip',t:0,dur:EQUIP_DUR,armor:which};
  SFX.shutter();
  vibrate([28,90,12]);
}
function finishEquip(which){
  S.mode='armored'; S.armor=which; S.transition=null; S.lucidStreak=0; S.exposure=0;
  S.stranded=false; S.strandT=0;
  // and you are up again, which is the entire proposition of an armour
  S.collapsed=0; S.pendingCollapse=false; player.kneel=0;
  S.worn++;
  // reaching for one at all costs you a little of the ground you can get back to
  if(L.proto) S.floor=Math.min(FLOOR_CAP,S.floor+FLOOR_EQUIP);
  if(which==='climb'){
    /* the impassable thing in front of you, redrawn as a game with an answer */
    S.course=buildClimbCourse(player.x,player.y);
    S.armTMax=courseTime(0); S.armT=S.armTMax;
    S.onPlat=S.course[0]; S.baseY=S.course[0].y; S.coyote=COYOTE; S.jbuf=0; player.vy=0; S.reachT=0;
    S.courseFrom={x:player.x,y:player.y};
    say('climb',P.climb.cyan);
  } else if(which==='routine'){
    S.routineTrack=buildRoutine(player.x);
    S.routineIdx=0; S.routineEnd=false; S.routineCadence=0; S.reachT=0;
    S.armTMax=ARMOR_TIME; S.armT=S.armTMax;
    S.courseFrom={x:player.x,y:player.y};
    say('routine',P.routine.gold);
  } else if(which==='dogma'){
    S.dogmaTrack=buildDogma(player.x);
    S.dogmaIdx=0; S.dogmaDash=null; S.archUndef=false;
    say('dogma',ARMORS.dogma.key);
  } else if(which==='refuge'){
    S.companion=buildRefuge(player.x);
    say('refuge',ARMORS.refuge.key);
  } else if(which==='creation'){
    S.paint=PAINT_TOTAL; S.trail=[{x:player.x,y:player.y,age:0}];
    S.paintAng=0; S.paintFrom=player.x; S.paintLand=0;
    // the far side of whatever is in front of you, which is what it has to reach
    { const {edge,exit}=nextObstacle(player.x);
      S.paintGoal=(exit===null?edge+600:exit); }
    say('creation',ARMORS.creation.key);
  } else if(which==='archive'){
    S.archTrack=buildArchive(player.x);
    S.archIdx=0; S.archUndef=false; S.aim=null;
    player.y=S.archTrack[0].y;
    say('archive',ARMORS.archive.key);
  }
  AU.tick=0;
}

/* Stepping off an illusion while you are standing on something real costs you
   nothing — you finished it rather than broke it. Stepping off one in mid-air
   is what breaking a lie actually is, and that is what leaves a mark. */
function onRealGround(){
  const gy=terrainY(player.x);
  return gy!==null&&standable(player.x)&&Math.abs(player.y-gy)<=CLIMB_LAND;
}
function stripAway(){
  if(S.mode!=='armored'||S.transition) return;
  // There is no door on the inside of your first one. You did not put it on.
  if(S.opening==='ladder') return;
  shatter(L.proto?onRealGround():false);
}

function shatter(soft){
  if(S.transition||S.mode!=='armored') return;
  // snapshot the armoured frame so it can be broken into shards
  snapCtx.setTransform(1,0,0,1,0,0);
  snapCtx.clearRect(0,0,snapCv.width,snapCv.height);
  snapCtx.setTransform(SCALE,0,0,SCALE,0,0);
  drawArmored(snapCtx,S.armor,1,1);
  const dur=soft?(S.opening==='reveal'?REVEAL_DUR:DISSOLVE_DUR):SHATTER_DUR;
  S.transition={type:'shatter',t:0,dur,soft:!!soft,shards:makeShards()};
  if(soft) SFX.dissolve(); else SFX.shatter();
  vibrate(soft?[10,60,10]:[150]);
}
function finishShatter(soft){
  const wasArmor=S.armor;
  S.mode='lucid'; S.armor=null; S.transition=null; S.shattered++; S.exposure=0;
  S.stranded=false; S.strandT=0; S.deadEnd=false; S.routineEnd=false;
  if(S.pendingCollapse){ S.pendingCollapse=false; S.collapsed=COLLAPSE_DUR; SFX.collapse(); }
  lived.add(wasArmor);                     // now you know what one of those buys
  if(!soft) S.broken++;
  if(L.proto&&!soft) S.floor=Math.min(FLOOR_CAP,S.floor+FLOOR_BREAK);
  S.lucidStreak=0;
  S.dread=Math.max(S.floor,Math.min(1,S.dread+(soft?0.0:0.30)));
  player.vx=0; player.vy=0; player.tremor=soft?0.4:1.6;
  if(!soft) say('shatter');
  if(L.proto&&!soft&&S.shattered>=2) say('scar');
  // The staircase was never out there — it was a way of not looking at the
  // slope. Step off one onto ground too steep to stand on and you go down it,
  // back to the last place that would hold you.
  if(!soft&&terrainY(player.x)!==null&&!standable(player.x)){
    let sx=player.x;
    while(sx>L.terrain[0][0]&&!(terrainY(sx)!==null&&standable(sx))) sx-=8;
    if(sx!==player.x){ player.x=sx; SFX.smash(true); S.dread=Math.min(1,S.dread+0.18); }
  }
  // Standing on nothing: the lie was the only bridge.
  if(terrainY(player.x)===null){ S.falling=true; S.fallV=0; }
  else player.y=terrainYSafe(player.x);
  /* The first one comes off and the argument of the whole game is made in one
     cut: the ladder was drawn over this, you are a small warm thing standing on
     a real ledge, and the drop you spent nine storeys not looking at is behind
     you. The weight arrives a few seconds later. First it is only beautiful. */
  if(S.opening==='reveal'){
    S.opening=''; S.revealT=REVEAL_HOLD; S.hint=''; S.hintA=0;
    S.dread=0; S.floor=FLOOR_BASE; S.grace=REVEAL_HOLD; S.exposure=0;
    S.lucidStreak=0; player.tremor=0.3; player.kneel=0;
    S.worn=1;                    // you crossed on one. You just did not pick it.
    usedMove=false;              // and the ground moves differently over here
    fired.delete('start'); say('start');
  }
  if(wasArmor==='refuge'&&S.companion&&S.companion.gone&&!soft) say('refugeGone');
  if(wasArmor==='creation'&&!soft) say('creationDry');
  // an illusion that carried you the whole way sets you down and dissolves;
  // one that merely set you down somewhere real just goes, and costs nothing
  if(soft&&player.x>L.goalX-40){ S.ended=true; S.endT=0; say(['done','cityDone','vaultDone'][S.levelIdx]); }
}
// Angles only — the triangles are rebuilt each frame, because the view widens
// as the blinders come off and stale coordinates would leave the corners bare.
/* ------------------------------------------------------------ level load */
function loadLevel(i){
  S.levelIdx=clamp(i,0,LEVELS.length-1);
  L=LEVELS[S.levelIdx];
  PROPS=L.build();
  S.cleared.clear();
  computeRegions();
  fired.clear(); promptQ.length=0; activePrompt=null;
  S.openDone=false;
  restartLevel();
  // a level that opens inside an armour has no establishing shot to give away
  S.intro=(L.coldOpen&&!S.openDone)?0:INTRO_DUR;
}
function nextLevel(){
  if(S.levelIdx<LEVELS.length-1){ loadLevel(S.levelIdx+1); S.screen='play'; }
  else S.screen='complete';
}

/* Everything a project of meaning left behind, swept up. */
function clearArmorState(){
  S.climbTrack=[]; S.climbIdx=0; S.climbDash=null; S.deadEnd=false;
  S.course=[]; S.onPlat=null; S.baseY=undefined; S.jbuf=0; S.coyote=0; S.armT=0; S.armTMax=1;
  S.routineTrack=[]; S.routineIdx=0; S.routineDash=null; S.routineEnd=false; S.reachT=0;
  S.cadence=0; S.stumbles=0; S.beatHit=0; S.beatHeld=false; S.stepLock=0;
  S.dogmaTrack=[]; S.dogmaIdx=0; S.dogmaDash=null;
  S.dogV=0; S.dogStall=0; S.dogHits=0; S.dogSlams=0; S.dogSwing=0; S.dogFlash=0; S.dogSwingReq=false;
  S.stranded=false; S.strandT=0; S.ceilingFlash=0;
  S.companion=null; S.paint=PAINT_TOTAL; S.trail=[]; S.aim=null;
  S.thread=REFUGE_SLACK; S.refugeNear=true; S.refugeD=0;
  S.archTrack=[]; S.archIdx=0; S.archUndef=false; S.archDash=null;
  S.archAng=ARCH_LO; S.archDir=1; S.archErr=0; S.archShort=0;
  S.paintAng=0; S.paintGoal=0; S.paintFrom=0; S.paintLand=0;
  player.vy=0;
}

/* You did not die; you fell. What you lose is the thing you built and the
   ground it covered — not the afternoon. You come back to the last piece of
   ground that would have held you, shaking, and start from there. */
function recover(){
  clearArmorState();
  player.x=(player.safe===undefined?L.spawn:player.safe);
  player.y=terrainYSafe(player.x); player.vx=0; player.tremor=1.5; player.kneel=0;
  S.mode='lucid'; S.armor=null; S.transition=null; S.wheelOpen=false; S.wheelSel=null;
  S.falling=false; S.fallV=0; S.collapsed=0; S.pendingCollapse=false;
  S.dread=Math.max(0.62,S.floor); S.grace=2.5; S.lucidStreak=0; S.exposure=0; S.fadeTarget=0;
  zoom=ZOOM_LUCID; applyZoom(); camTarget(); cam.x=cam.tx; cam.y=cam.ty;
}

/* The lie was the only thing holding you up. Begin this level again. */
function restartLevel(){
  S.cleared.clear(); computeRegions();
  player.x=L.spawn; player.y=terrainYSafe(L.spawn); player.vx=0; player.tremor=0.9; player.kneel=0;
  player.safe=L.spawn;
  S.mode='lucid'; S.armor=null; S.transition=null; S.wheelOpen=false; S.wheelSel=null;
  S.dread=0.22; S.collapsed=0; S.pendingCollapse=false; S.lucidStreak=0; S.shattered=0;
  S.grace=0; S.deadEndSeen=false; S.everDown=false; S.floor=FLOOR_BASE; S.worn=0; S.broken=0;
  S.exposure=0;
  clearArmorState();
  S.falling=false; S.fallV=0; S.ended=false; S.endT=0;
  S.unlocked.clear(); S.goalA=1; S.fadeTarget=0;
  // the shore, from the top: trembling, unarmoured, out of illusions
  S.act=L.shore?'wake':''; S.actT=0; S.calm=0; S.lastBeat=-1; S.wheelSeen=false;
  S.choiceSel=null; S.crack=0; S.flood=0; S.light=0; S.dim=0; S.epiI=-1; S.epiT=0;
  S.zt=0; S.camK=2.4; S.wide=false;
  S.opening=''; S.openTry=0; S.tear=null; S.revealT=0;
  if(PROPS&&PROPS.ripples) PROPS.ripples.length=0;
  zoom=ZOOM_LUCID; applyZoom(); camTarget(); cam.x=cam.tx; cam.y=cam.ty;
  // and once it has been earned, it is not taken back: restarting the ridge
  // puts you on the ridge, unarmoured, with the wheel already yours
  if(L.coldOpen&&!S.openDone) enterOpening();
}

/* ========================================================== THE OPENING === */
/* The first level does not open on the ridge. It opens nine storeys up a
   ladder that is not there, with a clock in the corner and a cut line coming
   up underneath, and nothing anywhere on the screen admits that there is a
   world. Which is roughly the situation of a person, and it is not something
   they chose either: the armour is already on by the time you can ask.

   There is exactly one way out of it, and it is marked THE NEXT LEVEL. */
function enterOpening(){
  S.opening='ladder'; S.openTry=0;
  // the lines that would give the frame away do not get to fire in here
  fired.add('climb'); fired.add('grid'); fired.add('start');
  startOpeningLadder();
}
function startOpeningLadder(){
  const c=L.coldOpen;
  player.x=c.x; player.y=terrainYSafe(c.x); player.vx=0; player.vy=0;
  player.safe=c.x; player.tremor=0; player.kneel=0; player.facing=1;
  S.mode='armored'; S.armor='climb'; S.transition=null; S.tear=null;
  S.stranded=false; S.strandT=0; S.collapsed=0; S.pendingCollapse=false;
  S.falling=false; S.fallV=0; S.dread=0; S.fade=0; S.fadeTarget=0;
  S.course=buildClimbCourse(player.x,player.y,S.openTry);
  S.armTMax=courseTime(S.openTry); S.armT=S.armTMax;
  S.onPlat=S.course[0]; S.platX=platX(S.course[0]);
  S.baseY=S.course[0].y; S.coyote=COYOTE; S.jbuf=0; S.reachT=0;
  S.courseFrom={x:player.x,y:player.y};
  S.ceilingFlash=0; AU.tick=0;
  zoom=ARMORS.climb.zoom; applyZoom(); camTarget(); cam.x=cam.tx; cam.y=cam.ty;
}
/* Failing does not hand you the world. The frame slips — a band or two of
   something that is not this, too brief and too broken to read — and then you
   are back at the bottom of the ladder with the clock reset. That is what
   failing at a project actually gets you: the project again.

   What it does do is slip a little further every time. Nobody gets all the way
   through this without noticing that something is behind it. */
const TEAR_SKY=0.50;                       // where the horizon sits in the tear's frame
function makeTearBands(g){
  const r=mulberry32(g*977+13), n=1+Math.min(4,Math.ceil(g*0.8));
  const reach=lerp(0.05,0.42,(g-1)/5);      // how near the middle of the frame it dares
  const th=lerp(0.015,0.105,(g-1)/5);       // and how much of it comes through
  const out=[];
  for(let i=0;i<n;i++){
    const side=(i%2)?1:-1;
    out.push({yf:clamp(0.5+side*(0.47-reach*r())-th/2,0.005,0.98),
              hf:th*lerp(0.55,1.45,r())});
  }
  // and by the fourth time one of them opens across the horizon itself, which is
  // the one thing in the picture that cannot be mistaken for a rendering fault
  if(g>=4) out.push({yf:TEAR_SKY-th*0.8,hf:th*lerp(1.4,2.1,r())});
  return out;
}
function openingTear(){
  if(S.tear||S.transition) return;
  S.openTry++;
  const g=Math.min(S.openTry,6);
  snapCtx.setTransform(1,0,0,1,0,0);
  snapCtx.clearRect(0,0,snapCv.width,snapCv.height);
  snapCtx.setTransform(SCALE,0,0,SCALE,0,0);
  drawArmored(snapCtx,'climb',1,1);
  S.tear={t:0,dur:0.30+g*0.12,g,bands:makeTearBands(g)};
  S.ceilingFlash=1; SFX.smash(false); vibrate([16,40,16]);
  if(g>=3) SFX.cello();                     // by now it is coming through the wall
}

function makeShards(){
  const N=18, out=[], angs=[];
  for(let i=0;i<N;i++) angs.push(i/N*Math.PI*2+rr(-0.09,0.09));
  for(let i=0;i<N;i++){
    const a1=angs[i], a2=angs[(i+1)%N]+(i===N-1?Math.PI*2:0);
    out.push({a1,a2,dx:Math.cos((a1+a2)/2),dy:Math.sin((a1+a2)/2),rot:rr(-0.3,0.3),sp:rr(0.7,1.35)});
  }
  return out;
}
function shardTri(s){
  const cx=VIEW_W/2, cy=VIEW_H/2, R=Math.hypot(VIEW_W,VIEW_H);
  return [[cx,cy],[cx+Math.cos(s.a1)*R,cy+Math.sin(s.a1)*R],[cx+Math.cos(s.a2)*R,cy+Math.sin(s.a2)*R]];
}
function vibrate(pat){ if(navigator.vibrate&&AU.on){ try{navigator.vibrate(pat);}catch(e){} } }

/* ================================================================ CLIMB === */
/* Inside the blinders it is a jumping game, and a jumping game is a wonderful
   thing: it has edges, it has an answer, and while you are playing it you are
   not thinking about anything else. That is the entire service being rendered. */
function jumpPressed(){
  if(S.mode!=='armored'||S.transition) return;
  S.jbuf=BUFFER;
}
/* One press, whatever you happen to be wearing. Each armour reads it as the
   only verb it has: jump, step, smash, solve. */
function armorTap(){
  if(S.mode!=='armored'||S.transition||S.tear) return;
  if(S.armor==='climb') jumpPressed();
  else if(S.armor==='routine') routineStep();
  else if(S.armor==='dogma') dogmaSwing();
  else if(S.armor==='archive') archiveJump();
}

/* Smash forward. The thing that stops you is the thing you smashed. */

/* Solve the gap, jump the gap. Until the gap has no solution. */
function archiveJump(){
  if(S.archDash||S.archUndef||S.transition) return;
  const T=S.archTrack, n=S.archIdx+1;
  if(n>=T.length){
    S.archUndef=true; S.stranded=true; S.ceilingFlash=1;
    say('archUndef',ARMORS.archive.key); SFX.glitch(); return;
  }
  const from=T[S.archIdx], to=T[n];
  const hit=archSolve(S.archAng,from,to);
  const err=hit?(hit.x-to.x):1e9;
  if(hit&&Math.abs(err)<=to.w/2){
    S.archDash={from:{x:from.x,y:from.y},to,t:0,tof:hit.t,dur:Math.max(0.26,hit.t*0.82),ang:S.archAng};
    S.archIdx=n; SFX.ping(); vibrate(10);
    // a sum that comes out gives you back one that did not: the aim speeds up
    // with your mistakes, but it is no longer a ratchet
    if(S.archErr>0) S.archErr--;
    say('archRun',ARMORS.archive.key);
    return;
  }
  /* Reason does not drop you. It retracts the derivation, charges you for it,
     and starts the aim moving faster than it was before. */
  S.archErr++; S.armT=Math.max(0,S.armT-ARCH_MISS);
  S.ceilingFlash=0.8; SFX.glitch(); vibrate([26,24,26]);
  // and if no angle at all would have answered, it has run out of arithmetic
  if(!archReachable(from,to)){
    S.archShort++;
    if(S.archShort>=2){
      S.archUndef=true; S.stranded=true; S.ceilingFlash=1;
      say('archUndef',ARMORS.archive.key); vibrate([40,30,40]);
    }
  }
}
// whether any angle it is willing to consider gets there at all
function archReachable(from,to){
  for(let a=ARCH_LO;a<=ARCH_HI;a+=0.02){
    const h=archSolve(a,from,to);
    if(h&&Math.abs(h.x-to.x)<=to.w/2) return true;
  }
  return false;
}

/* ================================================================ SHORE === */
/* The Great Silence has no track to advance along and no armour to break. It
   runs as a short sequence of acts, and its only mechanic is whether you are
   moving with the water or against it. Nothing here can fail; the worst that
   happens is that you stay heavy. */

function spawnRipple(x,s){
  if(!PROPS.ripples) return;
  PROPS.ripples.push({x,t:0,life:lerp(3.4,6.2,s),s});
  if(PROPS.ripples.length>70) PROPS.ripples.shift();
}

// The two words the whole game has been walking towards.
function choiceBoxes(){
  // sized off the frame, so the two answers still fit side by side on a phone
  const w=clamp(VIEW_W*0.17,us(108),us(178)), h=us(58), y=VIEW_H*0.855;
  const gap=Math.max(w*0.24,us(28));
  return [{key:'yes',label:'YES',x:VIEW_W/2-gap/2-w,y,w,h},
          {key:'no', label:'NO', x:VIEW_W/2+gap/2,y,w,h}];
}
function choiceHit(v){
  if(S.act!=='ask') return null;
  for(const b of choiceBoxes())
    if(v.x>b.x&&v.x<b.x+b.w&&v.y>b.y-b.h/2&&v.y<b.y+b.h/2) return b.key;
  return null;
}
function chooseMirror(yes){
  if(S.act!=='ask') return;
  S.choiceSel=yes?'yes':'no'; S.act=yes?'nihil':'dissolve'; S.actT=0;
  if(yes){ say('nihil'); SFX.collapse(); vibrate([220]); }
  else { say('leap'); SFX.resolve(); vibrate([14,70,14,70,14]); }
}

function updateShore(dt,dir){
  S.actT+=dt; S.lucidStreak+=dt;
  const A=S.act;
  /* the water breathes once every BEAT, whether or not you are listening */
  const bi=Math.floor(S.t/BEAT);
  if(bi!==S.lastBeat){
    S.lastBeat=bi;
    if(A!=='wake') spawnRipple(player.x,S.calm);
    if(S.flood>0&&S.flood<1) spawnRipple(L.monoX,1);
    SFX.lap(S.calm);
  }
  if(PROPS.ripples) for(let i=PROPS.ripples.length-1;i>=0;i--){
    const r=PROPS.ripples[i]; r.t+=dt;
    if(r.t>r.life) PROPS.ripples.splice(i,1);
  }

  const walk=(maxv,resp,limit)=>{
    player.vx+=(dir*maxv-player.vx)*(1-Math.exp(-dt*resp));
    if(Math.abs(player.vx)<0.5&&dir===0) player.vx=0;
    const nx=clamp(player.x+player.vx*dt,regionAt(player.x)[0],limit);
    if(nx!==player.x) player.facing=Math.sign(nx-player.x)||player.facing;
    if(nx>=limit&&player.vx>0) player.vx=0;
    player.x=nx; player.y=L.water;
  };
  const drift=(sp,resp)=>{ player.vx=lerp(player.vx,sp,1-Math.exp(-dt*resp));
                           player.x+=player.vx*dt; player.y=L.water; };
  const hintNow=h=>{ S.hint=h; S.hintA=lerp(S.hintA,h?1:0,1-Math.exp(-dt*3)); };
  const STOP=L.monoX-MONO_W/2-76;   // you cannot walk through your own reflection

  if(A==='wake'){
    /* Act I — The Empty Wheel. You are here, it is enormous, and the first
       thing anyone reaches for is something to put between them and it. */
    walk(30,1.15,STOP);
    S.calm=Math.max(0,S.calm-dt*0.05);
    player.tremor=lerp(player.tremor,1.55,1-Math.exp(-dt*1.6));
    S.dread=lerp(S.dread,0.66,1-Math.exp(-dt*0.7));
    hintNow(S.wheelSeen?'':(IS_TOUCH?'Hold two thumbs to focus':'Hold SPACE to focus'));
    // the act turns on finding the wheel spent — or, for anyone who never
    // reaches for it, on standing here long enough to work it out alone
    if((S.wheelSeen&&!S.wheelOpen&&S.actT>1.0)||S.actT>28){ say('empty'); S.act='walk'; S.actT=0; }
  }

  else if(A==='walk'){
    /* Act II — Learning to Walk Unarmoured. Fight the water and it stays
       heavy. Move when it moves and it carries you. */
    const open=withWater();
    if(Math.abs(dir)>0.25) S.calm+=(open?CALM_GAIN:-CALM_LOSS)*dt;
    else if(S.calm<CALM_STILL) S.calm+=CALM_HOLD*dt;
    S.calm=clamp(S.calm,0,1);
    // Shoving forward while the water is drawing back is the resistance this
    // level is about, and it is answered the way water answers anything: you
    // still move, badly, and it is exhausting.
    walk(lerp(30,182,S.calm)*(open?1:PUSH_BACK),lerp(1.3,5.6,S.calm)*(open?1:0.55),STOP);
    // the violent vibration does not stop; it becomes a pulse, in time
    const pulse=0.16*S.calm*Math.sin(beatPhase()*6.283);
    player.tremor=lerp(player.tremor,lerp(1.5,0.26,S.calm)+pulse,1-Math.exp(-dt*2.4));
    S.dread=lerp(S.dread,(1-S.calm)*0.62,1-Math.exp(-dt*1.2));
    if(S.calm>0.72) say('ease');
    hintNow(S.calm>0.55?'':'Move when the water moves');
    if(player.x>=STOP-1){ S.act='mirror'; S.actT=0; player.vx=0; }
  }

  else if(A==='mirror'){
    /* Act III — The Mirror. Everything you built, showing up in the obsidian. */
    const open=withWater();
    walk(lerp(30,182,S.calm)*(open?1:PUSH_BACK),lerp(1.3,5.6,S.calm)*(open?1:0.55),STOP);
    player.tremor=lerp(player.tremor,lerp(1.4,0.30,S.calm),1-Math.exp(-dt*2));
    S.dread=lerp(S.dread,(1-S.calm)*0.48,1-Math.exp(-dt*1.2));
    if(S.actT>1.4) say('mirror');
    hintNow('');
    if(S.actT>5.0){ S.act='ask'; S.actT=0; }
  }

  else if(A==='ask'){
    player.vx=0; player.y=L.water;
    player.tremor=lerp(player.tremor,0.50,1-Math.exp(-dt*2));
    S.dread=lerp(S.dread,0.34,1-Math.exp(-dt*1.2));
    S.dim=lerp(S.dim,0.18,1-Math.exp(-dt*2));
    hintNow(IS_TOUCH?'Answer it':'Answer it · Y or N');
  }

  else if(A==='nihil'){
    /* [ YES ] — the nihilist trap. The screen goes out, and so do you. It is
       not a game over. It is an answer that does not get you anywhere. */
    player.vx=0; player.kneel=lerp(player.kneel,1,1-Math.exp(-dt*2.2));
    player.tremor=lerp(player.tremor,0.16,1-Math.exp(-dt*1.4));
    S.dim=lerp(S.dim,S.actT<7.0?0.90:0.18,1-Math.exp(-dt*2.2));
    hintNow('');
    // the question comes back, and so does the answer to that answer: say YES
    // as often as you like and it will tell you the same thing every time
    if(S.actT>9.4){ S.act='ask'; S.actT=0; S.choiceSel=null; player.kneel=0; fired.delete('nihil'); }
  }

  else if(A==='dissolve'){
    /* [ NO ] — the wall splits, and everything held in it comes out as light. */
    S.dim=lerp(S.dim,0,1-Math.exp(-dt*2));
    S.crack=clamp(S.crack+dt/1.5,0,1);
    if(S.crack>=1) S.flood=clamp(S.flood+dt/3.4,0,1);
    S.light=clamp(S.light+dt*0.10,0,0.34);
    player.vx=0; player.y=L.water;
    player.tremor=lerp(player.tremor,0.30,1-Math.exp(-dt*1.5));
    S.dread=lerp(S.dread,0.10,1-Math.exp(-dt*0.8));
    hintNow('');
    if(S.flood>=1){ S.act='walkout'; S.actT=0; }
  }

  else if(A==='walkout'){
    /* The gift of finitude: weightless controls. The tremor never leaves —
       it simply stops being the thing you are listening to. */
    S.calm=lerp(S.calm,1,1-Math.exp(-dt*1.5));
    S.light=clamp(S.light+dt*0.09,0,0.55);
    walk(205,7,L.goalX+60);
    player.tremor=lerp(player.tremor,0.22+0.10*Math.sin(beatPhase()*6.283),1-Math.exp(-dt*2));
    S.dread=lerp(S.dread,0,1-Math.exp(-dt*1.5));
    hintNow(S.actT<8?(IS_TOUCH?'Walk':'Drag, or →, to walk'):'');
    if(player.x>L.goalX-40){ S.act='rise'; S.actT=0; S.wide=true; S.camK=0.9; S.zt=ZOOM_SKY; }
  }

  else if(A==='rise'){
    // the camera lets go of you and climbs. You keep walking anyway.
    drift(58,0.8);
    player.tremor=lerp(player.tremor,0.20,1-Math.exp(-dt*1.2));
    S.light=clamp(S.light+dt*0.03,0,0.62);
    hintNow('');
    if(S.actT>4.5){ S.act='epilogue'; S.actT=0; S.epiI=0; S.epiT=0; }
  }

  else if(A==='epilogue'){
    drift(52,0.5);
    player.tremor=lerp(player.tremor,0.18,1-Math.exp(-dt*1.2));
    S.epiT+=dt;
    if(S.epiT>EPI_LINE){ S.epiT=0; S.epiI++; if(S.epiI>=EPILOGUE.length){ S.act='over'; S.actT=0; } }
  }

  else if(A==='over'){
    drift(44,0.4);
    if(S.actT>7.4){ S.fadeTarget=1; if(S.fade>0.96) S.screen='complete'; }
  }
}

/* ============================================================== UPDATE ==== */
// The Creation is the one armour that asks which way is up.
function moveInputY(){
  let d=0;
  if(keys.has('arrowup')||keys.has('w')) d-=1;
  if(keys.has('arrowdown')||keys.has('s')) d+=1;
  if(ptr.down&&!S.wheelOpen&&touches.size<2){
    const dy=ptr.y-ptr.sy;
    if(Math.abs(dy)>10) d=clamp(dy/110,-1,1);
  }
  return clamp(d,-1,1);
}
function moveInput(){
  let d=0;
  if(keys.has('arrowleft')||keys.has('a')) d-=1;
  if(keys.has('arrowright')||keys.has('d')) d+=1;
  if(ptr.down&&!S.wheelOpen&&touches.size<2){
    const dx=ptr.x-ptr.sx;
    if(Math.abs(dx)>10) d=clamp(dx/130,-1,1);
  }
  return clamp(d,-1,1);
}

function update(dt){
  S.wall+=dt;
  if(S.screen==='interstitial'){ S.interT+=dt; audioTick(dt); return; }
  if(S.screen!=='play'){ if(S.screen==='complete') S.doneT=(S.doneT||0)+dt; audioTick(dt); return; }
  S.t+=dt;
  // Levels 1–3 sink through a twilight as the session runs. The shore is already
  // night, and stays night: nothing there is running out.
  S.sunT=L.shore?0.5:Math.min(1,S.t/420);
  updatePrompts(dt);
  wheelKeys();
  S.ceilingFlash=Math.max(0,S.ceilingFlash-dt*0.8);

  /* ---- the frame slips ---- */
  if(S.tear){
    S.tear.t+=dt;
    if(S.tear.t>=S.tear.dur){ S.tear=null; startOpeningLadder(); }
    audioTick(dt); return;
  }

  /* ---- zoom follows state: the world opens as a lie breaks, closes as one locks in */
  const az=(S.armor&&ARMORS[S.armor].zoom)||ZOOM_ARMOR;
  let zt=(S.mode==='armored')?az:ZOOM_LUCID;
  if(S.transition&&S.transition.type==='equip') zt=lerp(ZOOM_LUCID,(ARMORS[S.transition.armor].zoom||ZOOM_ARMOR),smooth(inv(0.10,0.58,S.transition.t)));
  if(S.transition&&S.transition.type==='shatter')
    zt=lerp(az,S.opening==='reveal'?REVEAL_ZOOM:ZOOM_LUCID,smooth(inv(0.28,0.95,S.transition.t)));
  // and then keeps opening, out to the width this state always sees
  if(S.revealT>0) zt=lerp(REVEAL_ZOOM,ZOOM_LUCID,smooth(inv(REVEAL_LOCK,REVEAL_HOLD-0.4,REVEAL_HOLD-S.revealT)));
  // the shore drives its own camera height, and rises far more slowly than a lie breaks
  if(S.zt) zt=S.zt;
  zoom=lerp(zoom,zt,1-Math.exp(-dt*(S.zt?0.46:7)));
  applyZoom();

  // The distant peak hands off to the real one while the player is mid-chasm,
  // which can only happen armored — so the swap always sits behind the blinders.
  const MF=L.markerFade||[1100,1240];
  S.goalA=lerp(S.goalA,1-inv(MF[0],MF[1],player.x),1-Math.exp(-dt*4));

  /* ---- opening establishing shot: the destination, then the one who must reach it */
  if(S.intro>0){
    S.intro-=dt;
    if(S.intro<=0){ S.intro=0; say(['start','city','vault','shore'][S.levelIdx]); }
    const el=INTRO_DUR-S.intro;
    camTarget();
    const sx=L.goalX-VIEW_W*0.52, sy=terrainYSafe(L.goalX)-VIEW_H*0.46;
    const k=smooth(inv(INTRO_HOLD,INTRO_DUR,el));
    cam.x=lerp(sx,cam.tx,k); cam.y=lerp(sy,cam.ty,k);
    player.tremor=lerp(player.tremor,0.55,1-Math.exp(-dt*2));
    for(const f of PROPS.flowers) if(f.t>0) f.t=Math.max(0,f.t-dt);
    S.hintA=lerp(S.hintA,0,1-Math.exp(-dt*6));
    audioTick(dt); return;
  }

  /* ---- transitions ---- */
  if(S.transition){
    const tr=S.transition; tr.t+=dt;
    if(tr.t>=tr.dur){
      if(tr.type==='equip') finishEquip(tr.armor); else finishShatter(tr.soft);
    }
    // and the nine storeys fall away underneath the camera as they dissolve
    camTarget();
    const ck=1-Math.exp(-dt*(S.opening==='reveal'?4:3));
    cam.x=lerp(cam.x,cam.tx,ck); cam.y=lerp(cam.y,cam.ty,ck);
    audioTick(dt); return;
  }

  if(S.revealT>0) S.revealT=Math.max(0,S.revealT-dt);

  /* ---- falling into the chasm ---- */
  if(S.falling){
    S.fallV+=1500*dt; player.y+=S.fallV*dt;
    S.dread=Math.min(1,S.dread+dt*0.35);
    if(player.y>1750){ S.fadeTarget=1;
      if(S.fade>0.97) recover();
    }
    S.fade=lerp(S.fade,S.fadeTarget,1-Math.exp(-dt*3.2));
    camTarget(); cam.y=lerp(cam.y,player.y-VIEW_H*0.5,1-Math.exp(-dt*6));
    cam.x=lerp(cam.x,cam.tx,1-Math.exp(-dt*3));
    audioTick(dt); return;
  }
  S.fade=lerp(S.fade,S.fadeTarget,1-Math.exp(-dt*3.2));
  if(S.restarting&&S.fade>0.97){ S.restarting=false; restartLevel(); }

  /* ---- ending ---- */
  if(S.ended){
    S.endT+=dt;
    player.tremor=lerp(player.tremor,0.35,1-Math.exp(-dt*1.2));
    if(S.endT>8.5){ S.screen='interstitial'; S.interT=0; }
    camTarget(); cam.x=lerp(cam.x,cam.tx,1-Math.exp(-dt*1.4)); cam.y=lerp(cam.y,cam.ty,1-Math.exp(-dt*1.4));
    audioTick(dt); return;
  }

  let dir=moveInput();
  // for the first seconds on the far side, nothing is asked of you but looking
  if(S.revealT>REVEAL_HOLD-REVEAL_LOCK) dir=0;
  if(dir!==0) usedMove=true;

  if(L.shore){
    /* The last level: no armour to equip, nothing to outrun, and a tempo. */
    updateShore(dt,dir);
  } else if(S.mode==='lucid'){
    S.lucidStreak+=dt;
    // The lip you are walking toward — where the ground, and the walking, run out.
    const fwdEdge=regionAt(player.x)[1];
    const atEdge=Math.abs(player.x-fwdEdge)<200;
    const onCauseway=L.exposed&&player.x>L.exposed.x0&&player.x<L.exposed.x1;

    if(S.collapsed>0){
      /* You do not die. You sink to your knees and are, for a while, unable. */
      S.collapsed-=dt;
      player.vx=0; player.kneel=lerp(player.kneel,1,1-Math.exp(-dt*4));
      // you get up with the pressure lower and a little while where it stays there
      if(S.collapsed<=0){ S.dread=Math.max(0.42,S.floor); S.grace=4.0; }
    } else {
      player.kneel=lerp(player.kneel,0,1-Math.exp(-dt*3));
      // Heavy, high-inertia drag: the character lags well behind your intent.
      const MAXV=66;
      const target=dir*MAXV;
      player.vx+=(target-player.vx)*(1-Math.exp(-dt*1.55));
      if(Math.abs(player.vx)<0.6&&dir===0) player.vx=0;
      let nx=player.x+player.vx*dt;
      const R=regionAt(player.x);
      if(nx<R[0]){nx=R[0];player.vx=0;}
      if(nx>R[1]){nx=R[1];player.vx=0;}
      // you can walk out onto the causeway. You cannot make yourself keep walking.
      if(L.exposed&&S.dread>0.82&&nx>player.x&&nx>L.exposed.x0){ nx=player.x; player.vx=0; }
      player.x=nx; player.y=terrainYSafe(player.x);
      if(dir!==0) player.facing=Math.sign(dir);

      /* --- the Existential Dread meter ---
         Walking is the one thing that helps: keep moving over ground that will
         hold you and the pressure eases a little. Stand still, or stand at the
         lip of the drop, and it comes straight back. */
      const moving=Math.abs(player.vx)>6;
      // and the worse it has got, the more walking away from it is worth
      let rate=moving?-(0.010+0.060*S.dread):0.070;
      // — for a while. Nobody stays out here indefinitely.
      S.exposure+=dt;
      rate+=EXPOSE_RATE*Math.min(1,S.exposure/EXPOSE_FULL);
      // standing at the lip of the abyss, or under the open sky, is worse
      rate+=0.085*(1-inv(0,260,Math.abs(player.x-fwdEdge)))*(moving?0.4:1);
      // out on the open causeway, with no one, it comes on far faster
      if(onCauseway) rate+=0.34;
      // the minute after a collapse is numb: nothing reaches you for a while
      if(S.grace>0){ S.grace-=dt; rate=Math.min(rate,-0.035); }
      // walking keeps it at bay. It does not take it away.
      if(rate<0&&S.dread<=S.floor) rate=0;
      // Choosing a lie is not yet living one, so the gauge waits while the
      // wheel is open. And out on the causeway the body refuses to go further
      // rather than dropping you where you stand, over and over.
      if(!S.wheelOpen) S.dread=clamp(S.dread+rate*dt,0,onCauseway?0.88:1);
      // going down is the release: the clock on being out here starts over
      if(S.dread>=1){ S.collapsed=COLLAPSE_DUR; S.everDown=true; S.exposure=0;
                      SFX.collapse(); vibrate([300]); }
    }

    player.tremor=lerp(player.tremor,0.55+S.dread*1.35,1-Math.exp(-dt*2.2));

    /* Arriving on your own feet. No armour carries you the whole way on any of
       these levels, and the last stretch is always walkable — so the ending you
       are given is the one the last level is about, three levels early. */
    if(player.x>L.goalX-40&&!S.ended&&!S.transition&&!S.falling&&standable(player.x)){
      S.reachT=(S.reachT||0)+dt;
      if(S.reachT>1.0){
        S.ended=true; S.endT=0; S.dread=0; S.grace=0;
        SFX.dissolve(); vibrate([10,60,10]);
        say(['done','cityDone','vaultDone'][S.levelIdx]);
      }
    }

    /* --- narrative beats --- */
    if(S.levelIdx===0&&player.x>430) say('chasm');
    // the walk, marked out but not interrupted
    if(S.levelIdx===0&&S.openDone){
      if(player.x>3000) say('walk1');
      if(player.x>6000) say('walk2');
      if(player.x>9000) say('walk3');
      if(player.x>12000) say('walk4');
      if(player.x>15000) say('walk5');
      if(player.x>17800) say('walk6');
    }
    /* The second illusion is not offered while there is still ground. It is
       offered at the lip, where the walking stops working — which is the only
       honest moment to offer anybody one. */
    if(S.shattered>=1&&S.revealT<=0&&S.lucidStreak>3.0&&(atEdge||onCauseway)&&!S.unlocked.has(L.armors[1])){
      S.unlocked.add(L.armors[1]); say('naked');
    }
    // contextual hint — silent while collapsed, when no advice applies
    let h='';
    if(S.collapsed>0) h='';
    else if(S.revealT>REVEAL_HOLD-REVEAL_LOCK) h='';   // you are looking, not playing
    else if(!usedMove) h=IS_TOUCH?'Drag to move':'Drag, or ← →, to move';
    // out on the open, the advice is not "try harder"
    else if(onCauseway&&S.dread>0.5) h=IS_TOUCH?'Not this part alone · hold two thumbs':'Not this part alone · hold SPACE';
    else if(atEdge&&(S.dread>0.30||S.deadEndSeen||S.everDown)&&!usedWheel) h=IS_TOUCH?'Hold two thumbs to focus':'Hold SPACE to focus';
    else if(S.shattered>=1&&S.unlocked.has(L.armors[1])) h=IS_TOUCH?'Hold two thumbs to focus':'Hold SPACE to focus';
    S.hint=h; S.hintA=lerp(S.hintA,h?1:0,1-Math.exp(-dt*3));

  } else {
    /* --------------------------------------------------------- armoured */
    // A working illusion holds the dread off entirely. One that has run out of
    // track stops working — and the pressure comes back while you stand in it.
    if(S.stranded){
      S.strandT+=dt;
      S.dread=clamp(S.dread+dt*(0.055+Math.min(S.strandT,20)*0.004),0,1);
      if(S.dread>=1&&!S.transition){ S.pendingCollapse=true; shatter(false); }
    } else {
      S.dread=Math.max(0,S.dread-dt*0.55);
    }
    player.tremor=lerp(player.tremor,S.stranded?Math.min(0.5,S.strandT*0.06):0,1-Math.exp(-dt*(S.stranded?2:14)));
    S.lucidStreak=0;

    if(S.armor==='climb'){
      /* --- the jumping game, on a clock --- */
      const C=S.course;
      S.armT-=dt;
      if(S.armT<=0) armorFails();
      else if(C&&C.length){
        if(keys.has('arrowup')||keys.has('w')||keys.has(' ')) S.jbuf=BUFFER;
        const prevY=player.y;
        // a rung that will not hold still takes you with it while you stand on it
        if(S.onPlat&&S.onPlat.drift){
          const nx=platX(S.onPlat);
          if(S.platX!==undefined) player.x+=nx-S.platX;
          S.platX=nx;
        }
        player.vx+=(dir*RUN-player.vx)*(1-Math.exp(-dt*(S.onPlat?18:8)));
        player.vy+=GRAV*dt;
        player.x+=player.vx*dt; player.y+=player.vy*dt;
        // one-way rungs: you land on them, you do not bump into them
        let landed=null;
        if(player.vy>=0) for(const p of C){
          if(prevY<=p.y+2&&player.y>=p.y&&Math.abs(player.x-platX(p))<p.w/2+5){ landed=p; break; }
        }
        if(landed){
          if(!S.onPlat&&player.vy>200) SFX.wood();
          player.y=landed.y; player.vy=0; S.onPlat=landed; S.platX=platX(landed);
          S.coyote=COYOTE; S.baseY=landed.y;
          say('grid',P.climb.cyan);
        } else { S.onPlat=null; S.coyote=Math.max(0,S.coyote-dt); }
        S.jbuf=Math.max(0,S.jbuf-dt);
        if(S.jbuf>0&&S.coyote>0){
          player.vy=JUMP_V; S.jbuf=0; S.coyote=0; S.onPlat=null; SFX.snap(); vibrate(8);
        }
        // arrived: the illusion sets you down on real ground and goes quietly
        if(landed&&landed.exit&&!S.transition){
          S.reachT=(S.reachT||0)+dt;
          if(S.reachT>0.18) armorArrives(C.goal);
        } else if(!landed||!landed.exit) S.reachT=0;
        // Falling only drops you a storey. The cut line coming up underneath is
        // what makes that matter: there is no storey low enough to wait on.
        C.floor=climbFloor();
        if(player.y>C.floor) armorFails();
      }
      // arriving clears the advice; do not put it straight back on the same frame
      if(!S.transition){
        const showFor=(S.opening==='ladder'&&S.openTry===0)?7:4;
        S.hint=(S.armT<S.armTMax-showFor)?'':(IS_TOUCH?'Drag to move  ·  tap to jump':'← →  move   ·   SPACE  jump');
        S.hintA=lerp(S.hintA,S.hint?1:0,1-Math.exp(-dt*3));
      }
    }

    if(S.armor==='routine'){
      S.armT-=dt;
      if(S.armT<=0) armorFails();
      // the beat runs whether or not you are keeping it, and it speeds up
      S.beatDur=lerp(BEAT_SLOW,BEAT_FAST,1-S.routineLeft/STAIR_STEPS);
      S.beatT-=dt;
      if(S.beatT<=0){ S.beatT+=S.beatDur; if(AU.on&&!S.routineEnd) SFX.tick(true); }
      S.beatHit=Math.max(0,S.beatHit-dt*3);
      S.stepLock=Math.max(0,S.stepLock-dt);
      S.stepAnim=Math.min(1,S.stepAnim+dt/Math.max(0.10,S.beatDur*0.45));
      const pressed=keys.has('arrowup')||keys.has('w')||keys.has(' ')||
                    keys.has('arrowright')||keys.has('d');
      if(pressed&&!S.beatHeld){ S.beatHeld=true; routineStep(); }
      if(!pressed) S.beatHeld=false;
      if(S.routineEnd){
        S.hint=IS_TOUCH?'The mornings run out here · double-tap to step off':'The mornings run out · ESC to step off';
        S.hintA=lerp(S.hintA,1,1-Math.exp(-dt*4));
      } else {
        S.hint=IS_TOUCH?'Tap on the beat  ·  double-tap to step off':'Step on the beat  ·  ESC to step off';
        S.hintA=lerp(S.hintA,usedMove?0.45:1,1-Math.exp(-dt*3));
      }
    }

    /* ------------------------------------------------------- THE DOGMA */
    if(S.armor==='dogma'){
      const T=S.dogmaTrack;
      S.armT-=dt;
      S.dogFlash=Math.max(0,S.dogFlash-dt*3.2);
