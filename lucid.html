      S.dogSwing=Math.max(0,S.dogSwing-dt*5);
      if(S.armT<=0&&!S.stranded) armorFails();
      else if(!S.stranded){
        if(S.dogStall>0){ S.dogStall-=dt; S.dogV=0; }
        else { S.dogV=Math.min(DOG_VMAX,S.dogV+DOG_ACC*dt); player.x+=S.dogV*dt; }
        player.y=terrainYSafe(player.x); player.facing=1;
        if(S.dogSwingReq){
          S.dogSwingReq=false;
          if(S.dogStall<=0){
            S.dogSwing=1;
            let hit=null;
            for(const o of T) if(!o.dead&&o.x>player.x-40&&o.x-player.x<DOG_WIN){ hit=o; break; }
            if(hit){
              hit.dead=true; S.cleared.add(hit.x); computeRegions();
              S.dogHits++; S.dogV=Math.min(DOG_VMAX,S.dogV+DOG_GAIN);
              S.dogFlash=1; SFX.smash(true); vibrate(16);
              say('dogmaRun',ARMORS.dogma.key);
            } else {
              // swinging at nothing is the one thing that slows a cause down
              S.dogV=Math.max(DOG_FLOOR,S.dogV-DOG_WHIFF); SFX.tick(false); vibrate(5);
            }
          }
        }
        // and what you did not clear in time, you go into
        for(const o of T) if(!o.dead&&player.x>=o.x-10){
          o.dead=true; S.cleared.add(o.x); computeRegions();
          S.dogSlams++; S.dogStall=DOG_STALL; S.dogV=0; player.x=o.x-16;
          S.ceilingFlash=1; S.dread=Math.min(1,S.dread+0.06);
          SFX.smash(false); vibrate([40,50,40]); break;
        }
        /* The road runs out where the crowd does. Out on the open there is
           nothing to be against, and a cause with nothing to be against has
           nowhere to put itself. */
        if(player.x>=S.dogEnd-30){
          player.x=S.dogEnd-30; S.dogV=0;
          S.stranded=true; S.ceilingFlash=1; SFX.smash(true);
          say('dogmaWall',ARMORS.dogma.key); vibrate([8,40,8]);
        }
      }
      if(S.stranded){
        S.hint=IS_TOUCH?'Double-tap to strip away':'Double-click, or ESC, to strip away';
        S.hintA=lerp(S.hintA,1,1-Math.exp(-dt*4));
      } else {
        S.hint=(S.armT<S.armTMax-5)?'':(IS_TOUCH?'Tap to smash what is in the way':'SPACE, or →, to smash what is in the way');
        S.hintA=lerp(S.hintA,S.hint?1:0,1-Math.exp(-dt*3));
      }
    }

    /* ------------------------------------------------------ THE REFUGE */
    if(S.armor==='refuge'){
      const C=S.companion;
      /* It walks at its own speed. Sometimes that is faster than you want to
         go and sometimes it stops for no reason you are given, and neither of
         those is something you get a say in. */
      if(C&&!C.gone){
        C.life-=dt;
        C.vx=clamp(58+48*Math.sin(S.t*0.51+C.ph)+31*Math.sin(S.t*1.27+C.ph*1.7)
                     +19*Math.sin(S.t*2.90+C.ph*0.4),-14,126);
        C.x+=C.vx*dt;
        const CR=regionAt(C.x);
        if(C.x>CR[1]-24){ C.x=CR[1]-24; C.vx=0; }
        if(C.x<CR[0]+24){ C.x=CR[0]+24; C.vx=0; }
        C.y=terrainYSafe(C.x);
        if(C.life<=0){ C.gone=true; S.stranded=true; SFX.lifespan(); vibrate([120]); }
      }
      player.vx+=(dir*REFUGE_V-player.vx)*(1-Math.exp(-dt*3.6));
      let nx=player.x+player.vx*dt;
      const R=regionAt(player.x);
      if(nx<R[0]){nx=R[0];player.vx=0;}
      if(nx>R[1]){nx=R[1];player.vx=0;}
      player.x=nx; player.y=terrainYSafe(player.x);
      if(dir!==0) player.facing=Math.sign(dir);

      const ring=refugeRing();
      S.refugeD=(C&&!C.gone)?Math.abs(player.x-C.x):1e9;
      const near=S.refugeD<ring;
      S.refugeNear=near;
      // the thread. It is not shown as a number, only as the line going thin.
      if(!S.stranded){
        if(near) S.thread=Math.min(REFUGE_SLACK,S.thread+dt*0.75);
        else {
          S.thread-=dt;
          if(S.thread<=0&&C&&!C.gone){
            C.gone=true; S.stranded=true; S.ceilingFlash=1;
            SFX.lifespan(); vibrate([120]);
          }
        }
      }
      if(C&&C.gone){
        S.hint=IS_TOUCH?'Double-tap to strip away':'Double-click, or ESC, to strip away';
        S.hintA=lerp(S.hintA,1,1-Math.exp(-dt*4));
      } else {
        S.hint=near?'Stay inside it':'Get back';
        S.hintA=lerp(S.hintA,near?(usedMove?0.26:1):1,1-Math.exp(-dt*4));
      }
      if(player.x>L.goalX-40&&!S.ended&&!S.transition){
        S.reachT=(S.reachT||0)+dt; if(S.reachT>0.8) shatter(true);
      }
    }

    /* ---------------------------------------------------- THE CREATION */
    if(S.armor==='creation'){
      const ay=moveInputY();
      S.paintAng=lerp(S.paintAng,ay*CREATE_ANG,1-Math.exp(-dt*7));
      const drawing=(dir>0.2)&&S.paint>0&&!S.stranded;
      // you ride the end of your own line, and it only goes one way
      if(drawing){
        const stepL=CREATE_V*dt;
        const nx=player.x+Math.cos(S.paintAng)*stepL;
        const ny=player.y+Math.sin(S.paintAng)*stepL;
        const gy=terrainY(nx);
        const onLedge=(gy!==null)&&standable(nx)&&Math.abs(ny-gy)<=CLIMB_LAND;
        if(gy!==null&&!onLedge&&ny>gy){
          // the far wall, met somewhere below the top of it
          player.vx=0;
        } else {
          S.paint=Math.max(0,S.paint-stepL);
          player.x=nx; player.y=onLedge?gy:ny;
          S.trail.push({x:player.x,y:player.y,age:0});
          if(S.trail.length>1400) S.trail.shift();
        }
      }
      for(const t of S.trail) t.age+=dt;
      // the end of the line is the only part of it you can be standing on
      const tip=S.trail.length?S.trail[S.trail.length-1]:null;
      const onReal=(()=>{ const gy=terrainY(player.x);
        return gy!==null&&standable(player.x)&&Math.abs(player.y-gy)<=CLIMB_LAND; })();
      if(!onReal&&tip&&tip.age>=PAINT_DRY&&!S.falling){
        S.falling=true; S.fallV=0; S.ceilingFlash=1;
      }
      if(S.paint<=0&&!S.stranded&&onReal) S.stranded=true;
      // and if it did reach, it goes quietly and leaves you standing on stone
      if(onReal&&player.x>=S.paintGoal-24&&!S.transition&&!S.ended){
        S.paintLand+=dt; if(S.paintLand>0.5) shatter(true);
      } else S.paintLand=0;
      S.hint=S.paint<=0
        ? (IS_TOUCH?'Out of paint · double-tap to strip away':'Out of paint · ESC to strip away')
        : (IS_TOUCH?'Drag forward to draw  ·  up and down to aim it':'Hold → to draw  ·  ↑ ↓ to aim it');
      S.hintA=lerp(S.hintA,(S.paint<=0||!usedMove)?1:0.42,1-Math.exp(-dt*3));
    }

    /* ----------------------------------------------------- THE ARCHIVE */
    if(S.armor==='archive'){
      const AT=S.archTrack;
      const at=S.archTrack[S.archIdx];
      S.armT-=dt;
      // running out while standing on stone is arriving, not breaking
      if(S.armT<=0&&!S.transition){ if(at&&at.ground) shatter(true); else if(!S.archUndef) armorFails(); }
      else if(S.archDash){
        // the arc it computed, walked exactly. It is never wrong about this.
        const d=S.archDash; d.t+=dt;
        const k=Math.min(1,d.t/d.dur), tt=k*d.tof;
        player.x=d.from.x+Math.cos(d.ang)*ARCH_V*tt;
        player.y=d.from.y-Math.sin(d.ang)*ARCH_V*tt+0.5*ARCH_G*tt*tt;
        if(k>=1){ S.archDash=null; player.x=d.to.x; player.y=d.to.y; }
      } else if(!S.archUndef){
        // the aim sweeps, and every mistake makes it sweep faster
        const sp=ARCH_SWEEP+S.archErr*ARCH_SWEEP_ERR;
        S.archAng+=S.archDir*sp*dt;
        if(S.archAng>=ARCH_HI){ S.archAng=ARCH_HI; S.archDir=-1; }
        if(S.archAng<=ARCH_LO){ S.archAng=ARCH_LO; S.archDir=1; }
      }
      /* It sets you down on stone and then, without comment, offers one more.
         Almost everybody tries it. That is the point of putting it there. */
      if(S.archUndef){
        S.hint=IS_TOUCH?'Double-tap to strip away':'Double-click, or ESC, to strip away';
        S.hintA=lerp(S.hintA,1,1-Math.exp(-dt*4));
      } else if(at&&at.ground){
        S.hint=IS_TOUCH?'Stone · double-tap to step off':'Stone · ESC to step off';
        S.hintA=lerp(S.hintA,1,1-Math.exp(-dt*4));
      } else {
        S.hint=(S.armT<S.armTMax-6)?'':(IS_TOUCH?'Tap when the angle is right':'SPACE, or →, when the angle is right');
        S.hintA=lerp(S.hintA,S.hint?1:0,1-Math.exp(-dt*3));
      }
    }
  }

  // the last ground that would have held you, remembered for when a lie gives way
  if(!S.falling&&terrainY(player.x)!==null&&standable(player.x)) player.safe=player.x;

  camTarget();
  const k=1-Math.exp(-dt*(S.mode==='armored'?6.5:(S.revealT>0?1.15:(S.camK||2.4))));
  cam.x=lerp(cam.x,cam.tx,k); cam.y=lerp(cam.y,cam.ty,k);

  // decay: blossoms in real time, stone in years, cities in centuries
  for(const f of PROPS.flowers) if(f.t>0) f.t=Math.max(0,f.t-dt);
  for(const r of PROPS.ruins) r.yrs=Math.max(0,r.yrs-dt*0.5);
  if(PROPS.towers) for(const t of PROPS.towers) t.yrs=Math.max(0,t.yrs-dt*0.35);
  if(PROPS.statues) for(const t of PROPS.statues) t.yrs=Math.max(0,t.yrs-dt*0.4);

  audioTick(dt);
}

/* ============================================================== DRAWING === */
function wx(x,p){ return x-cam.x*p; }
function wy(y,p){ return y-cam.y*p; }

/* -------------------------------------------------------- the raw world -- */
function drawRaw(opt){
  opt=opt||{};
  const sun=S.sunT;
  const PT=L.paint;
  const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  // twilight sinking towards night as the session runs
  g.addColorStop(0.00, mixHex(PT.skyTop,PT.night,sun));
  g.addColorStop(0.34, mixHex(PT.skyMid,PT.night,sun));
  g.addColorStop(0.66, mixHex(PT.skyLow,PT.skyMid,sun*0.85));
  g.addColorStop(0.84, mixHex(PT.skyDusk,'#57414a',sun));
  g.addColorStop(1.00, mixHex(PT.skyFloor,'#3a3038',sun));
  ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,VIEW_H);

  /* stars — on the shore the sky is already full of them, and stays that way
     however far the camera climbs, so the field is spread across the sky that
     is actually in view rather than sitting in a fixed band of the world */
  const starA=L.shore?0.95:smooth(inv(0.35,1,sun))*0.9;
  if(starA>0.01){
    if(L.shore) eachShoreStar((px,py,tw,r)=>{
      ctx.fillStyle=hex(L.paint.star,starA*tw*0.85);
      ctx.beginPath(); ctx.arc(px,py,r,0,6.283); ctx.fill();
    });
    else for(const s of stars){
      const px=wx(s.x,0.02)%(VIEW_W+400), py=wy(s.y,0.02);
      const tw=0.55+0.45*Math.sin(S.t*1.4+s.tw);
      ctx.fillStyle=hex(L.paint.star,starA*tw*0.85);
      ctx.beginPath(); ctx.arc((px+VIEW_W+400)%(VIEW_W+400)-200,py,s.r,0,6.283); ctx.fill();
    }
  }

  /* the sun, sinking. The shore has no sun: it is lit by the thing it is
     walking towards, which is not a sun and is not going anywhere. */
  if(!L.shore){
    const sunX=wx(1750,0.03), sunY=wy(lerp(250,700,easeInCubic(sun)),0.03);
    const glow=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,460);
    glow.addColorStop(0,hex(PT.skyFloor,0.42*(1-sun*0.6)));
    glow.addColorStop(0.25,hex(PT.skyDusk,0.22*(1-sun*0.6)));
    glow.addColorStop(1,hex(PT.skyDusk,0));
    ctx.fillStyle=glow; ctx.fillRect(sunX-460,sunY-460,920,920);
    ctx.fillStyle=hex(PT.skyFloor,0.85*(1-sun*0.75));
    ctx.beginPath(); ctx.arc(sunX,sunY,34,0,6.283); ctx.fill();
  }

  /* clouds */
  for(const c of clouds){
    const px=((c.x+S.t*c.v)-cam.x*0.08)%(5400)-1200, py=wy(c.y,0.08);
    ctx.fillStyle=hex(mixHex(PT.skyDusk,PT.skyMid,sun),c.a*(1-sun*0.4));
    ctx.beginPath(); ctx.ellipse(px,py,c.w/2,c.h/2,0,0,6.283); ctx.fill();
  }

  // A peak far enough off to be the last thing in the picture goes in first, so
  // the nearer ridges cut its base off the way distance actually does.
  if(L.marker&&L.marker.behind) drawGoalMarker(sun);

  /* parallax ridgelines */
  for(const LR of L.ridges){
    ctx.beginPath();
    let started=false;
    for(const pt of LR.pts){
      const px=wx(pt[0],LR.p), py=wy(pt[1],LR.p);
      if(px<-300) continue;
      if(px>VIEW_W+300&&started) break;
      if(!started){ ctx.moveTo(px,py); started=true; } else ctx.lineTo(px,py);
    }
    ctx.lineTo(VIEW_W+400,VIEW_H+600); ctx.lineTo(-400,VIEW_H+600); ctx.closePath();
    ctx.fillStyle=mixHex(LR.c,L.paint.night,sun*0.55); ctx.fill();
    // atmospheric haze on the far layers
    if(LR.haze>0.05){
      const hg=ctx.createLinearGradient(0,wy(0,LR.p),0,wy(900,LR.p));
      hg.addColorStop(0,hex(L.paint.haze,0)); hg.addColorStop(1,hex(L.paint.haze,LR.haze*0.16*(1-sun*0.7)));
      ctx.fillStyle=hg; ctx.fill();
    }
  }

  if(!(L.marker&&L.marker.behind)) drawGoalMarker(sun);
  drawTowers(sun);
  drawChasm(sun);
  if(L.shore){ drawWater(); drawShoreLight(); drawMonolith(); }
  else { drawGround(sun); drawSpire(sun); }
  drawStatues(sun);
  drawCrowd(sun);
  drawRubble(sun);
  drawRuins(sun);
  drawGrass(sun);
  drawFlowers(sun);
  drawMotes();
  drawPlayerRaw();

  /* the only HUD in Lucidity: the screen itself closing in */
  drawDreadVignette();
  // and, at the very end, the opposite of that
  if(S.light>0.001){ ctx.fillStyle=hex('#EAF3FF',S.light*0.12); ctx.fillRect(0,0,VIEW_W,VIEW_H); }

  if(opt.desat>0.001){
    ctx.save(); ctx.globalCompositeOperation='saturation';
    ctx.globalAlpha=clamp(opt.desat,0,1); ctx.fillStyle='hsl(0,0%,50%)';
    ctx.fillRect(0,0,VIEW_W,VIEW_H); ctx.restore();
  }
  if(opt.blur>0.4&&ctx.filter!==undefined){
    ctx.save(); ctx.filter=`blur(${opt.blur.toFixed(1)}px)`;
    ctx.drawImage(cv,0,0,VIEW_W,VIEW_H); ctx.filter='none'; ctx.restore();
  }
  if(opt.dark>0.001){ ctx.fillStyle=hex('#000000',clamp(opt.dark,0,1)); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
}

function mixHex(a,b,t){
  t=clamp(t,0,1);
  const na=parseInt(a.slice(1),16), nb=parseInt(b.slice(1),16);
  const r=Math.round(lerp((na>>16)&255,(nb>>16)&255,t));
  const g=Math.round(lerp((na>>8)&255,(nb>>8)&255,t));
  const bl=Math.round(lerp(na&255,nb&255,t));
  return `rgb(${r},${g},${bl})`;
}

function drawChasm(sun){ for(const gap of L.gaps) drawGap(sun,gap); }
function drawGap(sun,gap){
  const x0=wx(gap.x0,1), x1=wx(gap.x1,1);
  if(x1<-100||x0>VIEW_W+100) return;
  const yTop=wy(Math.min(terrainYRaw(gap.x0),terrainYRaw(gap.x1))-6,1);
  const g=ctx.createLinearGradient(0,yTop,0,yTop+900);
  g.addColorStop(0,hex('#131c22',0)); g.addColorStop(0.12,hex('#131c22',0.5));
  g.addColorStop(0.4,'rgba(6,9,12,0.94)'); g.addColorStop(1,'#04070a');
  ctx.fillStyle=g; ctx.fillRect(x0-20,yTop,x1-x0+40,VIEW_H+900);
  // mist drifting in the throat of the gap
  for(let i=0;i<5;i++){
    const yy=yTop+120+i*95+Math.sin(S.t*0.18+i)*16;
    ctx.fillStyle=hex(L.paint.haze,0.030+0.014*Math.sin(S.t*0.25+i*1.7));
    ctx.beginPath(); ctx.ellipse((x0+x1)/2+Math.sin(S.t*0.11+i*2)*70,yy,(x1-x0)*0.62,26,0,0,6.283); ctx.fill();
  }
}

function solidRuns(){
  const T=L.terrain, out=[];
  let start=T[0][0]-140;
  const gs=L.gaps.slice().sort((a,b)=>a.x0-b.x0);
  for(const g of gs){ out.push([start,g.x0]); start=g.x1; }
  out.push([start,T[T.length-1][0]+140]);
  return out;
}
function drawGround(sun){
  const rim=mixHex(L.paint.rim,'#5a4a52',sun*0.8);
  const body=mixHex(L.paint.ground,L.paint.groundNight,sun*0.7);
  const drawPoly=(from,to)=>{
    ctx.beginPath();
    let first=true;
    for(const p of L.terrain){
      if(p[0]<from-260||p[0]>to+260) continue;
      const px=wx(p[0],1), py=wy(p[1],1);
      if(first){ ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
    }
    ctx.lineTo(wx(to,1),VIEW_H+900); ctx.lineTo(wx(from,1),VIEW_H+900); ctx.closePath();
  };
  // one solid mass per run of ground, voids left as voids
  const runs=solidRuns();
  ctx.fillStyle=body;
  for(const r of runs){ drawPoly(r[0],r[1]); ctx.fill(); }
  // sunlit rim along the top edge
  ctx.lineWidth=2.4; ctx.strokeStyle=hex(L.paint.rim,0.5*(1-sun*0.55));
  const strokeEdge=(from,to)=>{
    ctx.beginPath(); let first=true;
    for(const p of L.terrain){
      if(p[0]<from-260||p[0]>to+260) continue;
      const px=wx(p[0],1), py=wy(p[1],1);
      if(first){ctx.moveTo(px,py);first=false;} else ctx.lineTo(px,py);
    }
    ctx.stroke();
  };
  for(const r of runs) strokeEdge(r[0],r[1]);
  ctx.strokeStyle=hex(rim,0.22); ctx.lineWidth=1;
  // rock speckle
  const r2=mulberry32(7);
  ctx.fillStyle=hex(L.paint.rim,0.05);
  for(let i=0;i<420;i++){
    const x=lerp(-1600,3400,r2()), ty=terrainY(x);
    if(ty===null) continue;
    const px=wx(x,1), py=wy(ty+r2()*260+8,1);
    if(px<-40||px>VIEW_W+40) continue;
    ctx.fillRect(px,py,1.6,1.6);
  }
}

function drawRuins(sun){
  for(const r of PROPS.ruins){
    const gy=terrainYSafe(r.x), px=wx(r.x,1), py=wy(gy,1);
    if(px<-320||px>VIEW_W+320) continue;
    ctx.fillStyle=mixHex('#2c3a41','#0d141a',sun*0.7);
    if(r.kind==='pillar'){
      ctx.beginPath();
      ctx.moveTo(px-r.w/2,py); ctx.lineTo(px-r.w/2+3,py-r.h);
      ctx.lineTo(px+r.w/2-6,py-r.h+9); ctx.lineTo(px+r.w/2,py); ctx.closePath(); ctx.fill();
      ctx.fillStyle=hex(L.paint.rim,0.10*(1-sun*0.6));
      ctx.fillRect(px-r.w/2,py-r.h,3,r.h);
    } else {
      ctx.fillRect(px-r.w/2,py-r.h,15,r.h);
      ctx.fillRect(px+r.w/2-15,py-r.h,15,r.h);
      ctx.beginPath(); ctx.moveTo(px-r.w/2,py-r.h);
      ctx.quadraticCurveTo(px,py-r.h-44,px+r.w/2,py-r.h);
      ctx.lineTo(px+r.w/2-15,py-r.h); ctx.quadraticCurveTo(px,py-r.h-24,px-r.w/2+15,py-r.h);
      ctx.closePath(); ctx.fill();
    }
    // "years until forgotten" — the raw world shows you every clock
    const ty=py-r.h-58;
    setFont(ctx,400,11,MONO,'0.14em');
    ctx.textAlign='center';
    ctx.fillStyle=hex('#CBD5E1',0.30);
    ctx.fillText(`${r.kind.toUpperCase()} · ${Math.round(r.yrs).toLocaleString()} YRS`,px,ty);
    clearSpace(ctx);
  }
}

/* The destination. A solitary spire on the far peak — the one thing in the raw
   world that is neither decaying nor counting down. */
function drawSpire(sun){
  const bx=wx(L.goalX,1), by=wy(terrainYSafe(L.goalX),1);
  if(bx<-260||bx>VIEW_W+260) return;
  const H=182, W=26;
  const beat=0.5+0.5*Math.sin(S.t*0.85);

  ctx.fillStyle=mixHex(L.ridges[0].c,L.paint.night,sun*0.5);
  if(L.id===2){            // a gate out of the city: two piers and a lintel
    ctx.fillRect(bx-52,by-H*0.86,20,H*0.86);
    ctx.fillRect(bx+32,by-H*0.86,20,H*0.86);
    ctx.fillRect(bx-58,by-H*0.94,116,22);
  } else if(L.id===3){     // the vault's last threshold, open onto nothing
    ctx.fillRect(bx-46,by-H*0.80,14,H*0.80);
    ctx.fillRect(bx+32,by-H*0.80,14,H*0.80);
    ctx.beginPath(); ctx.moveTo(bx-46,by-H*0.80);
    ctx.quadraticCurveTo(bx,by-H*1.06,bx+46,by-H*0.80);
    ctx.lineTo(bx+32,by-H*0.80); ctx.quadraticCurveTo(bx,by-H*0.96,bx-32,by-H*0.80);
    ctx.closePath(); ctx.fill();
  } else {                 // a solitary spire on the far peak
  ctx.beginPath();
  ctx.moveTo(bx-W/2,by); ctx.lineTo(bx-W*0.30,by-H*0.72);
  ctx.lineTo(bx,by-H); ctx.lineTo(bx+W*0.30,by-H*0.72);
  ctx.lineTo(bx+W/2,by); ctx.closePath(); ctx.fill();
  }
  // sunward rim, so it reads as stone rather than a cut-out
  if(L.id===1){
    ctx.strokeStyle=hex(L.paint.rim,0.34*(1-sun*0.5)); ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(bx+W/2,by); ctx.lineTo(bx+W*0.30,by-H*0.72); ctx.lineTo(bx,by-H); ctx.stroke();
  }

  const gy=by-H-8;
  const g=ctx.createRadialGradient(bx,gy,0,bx,gy,92+beat*16);
  g.addColorStop(0,hex(L.paint.skyFloor,0.55+beat*0.22));
  g.addColorStop(0.30,hex(L.paint.rim,0.16+beat*0.07));
  g.addColorStop(1,hex(L.paint.rim,0));
  ctx.fillStyle=g; ctx.fillRect(bx-110,gy-110,220,220);
  ctx.fillStyle=hex('#F8FAFC',0.72+beat*0.24);
  ctx.beginPath(); ctx.arc(bx,gy,3.4,0,6.283); ctx.fill();
}

/* The same peak, read from far away. Sits in the distant parallax band so it
   stays on the horizon for the whole approach; fades out while the player is
   crossing the chasm behind the blinders, where the swap can't be seen. */
function drawGoalMarker(sun){
  const a=S.goalA;
  if(!L.marker||a<0.01) return;
  const p=L.marker.p||0.10, px=L.marker.x-cam.x*p, py=wy(L.marker.y,p);
  if(px<-300||px>VIEW_W+300) return;
  const beat=0.5+0.5*Math.sin(S.t*0.85);
  ctx.save(); ctx.globalAlpha=a;
  // hazier than the ridge in front of it, because everything far away is
  ctx.fillStyle=mixHex(L.marker.c||L.ridges[0].c,L.paint.night,sun*(L.marker.behind?0.35:0.4));
  // drawn behind, it runs off the bottom of the picture: distance cuts the base
  // off a mountain, and a mountain with a visible base is a cut-out
  const base=L.marker.behind?py+620:py+118;
  ctx.beginPath();
  ctx.moveTo(px-190,base); ctx.lineTo(px-74,py+18); ctx.lineTo(px-26,py+44);
  ctx.lineTo(px,py); ctx.lineTo(px+40,py+50); ctx.lineTo(px+104,py+8);
  ctx.lineTo(px+210,base); ctx.closePath(); ctx.fill();
  ctx.fillStyle=mixHex(L.ridges[0].c,L.paint.night,sun*0.2);
  ctx.fillRect(px-2.6,py-30,5.2,32);
  const gy=py-32;
  const g=ctx.createRadialGradient(px,gy,0,px,gy,44+beat*10);
  g.addColorStop(0,hex(L.paint.skyFloor,0.5+beat*0.24));
  g.addColorStop(1,hex(L.paint.skyDusk,0));
  ctx.fillStyle=g; ctx.fillRect(px-58,gy-58,116,116);
  ctx.restore();
}

/* ------------------------------------------------------------- the shore -
   One flat plane of water, and everything above it happening twice. There is
   nothing to climb, nothing decaying, and nothing counting down. */
const horizonY=()=>wy(L.water,1);
// Gradients here are defined in user space and reach far past the frame, so the
// rectangles they are painted through stay clamped to what can actually be seen.
const clipWater=hy=>{ ctx.beginPath(); ctx.rect(-300,hy,VIEW_W+600,VIEW_H-hy+400); ctx.clip(); };
const fillSeen=()=>ctx.fillRect(-300,-300,VIEW_W+600,VIEW_H+600);

/* The star field, spread across whatever sky is currently in frame. The camera
   ends this level a mile up, and an endless sky has to stay endless. */
function eachShoreStar(fn){
  const hy=horizonY(), span=VIEW_W+400;
  for(const s of stars){
    const px=((wx(s.x*2.4,0.02)%span)+span)%span-200;
    const py=lerp(-VIEW_H*0.06,hy-6,(s.y+40)/460);
    if(py>hy-4) continue;
    // sized in screen pixels: a star does not get smaller because you climbed
    fn(px,py,0.55+0.45*Math.sin(S.t*1.4+s.tw),us(s.r*0.95));
  }
}

function drawWater(){
  const hy=horizonY(), PT=L.paint;
  const g=ctx.createLinearGradient(0,hy,0,VIEW_H+600);
  g.addColorStop(0,mixHex(PT.skyDusk,PT.ground,0.42));
  g.addColorStop(0.12,mixHex(PT.ground,PT.night,0.30));
  g.addColorStop(1,PT.groundNight);
  ctx.fillStyle=g; ctx.fillRect(-300,hy,VIEW_W+600,VIEW_H-hy+400);

  ctx.save(); clipWater(hy);
  // the sky again, upside down and never quite still
  eachShoreStar((px,sy,tw,r)=>{
    const py=2*hy-sy+Math.sin(px*0.021+S.t*0.6)*us(1.8);
    if(py<hy+2||py>VIEW_H+60) return;
    ctx.fillStyle=hex(PT.star,0.32*tw*(1-inv(hy,VIEW_H,py)*0.72));
    ctx.beginPath(); ctx.arc(px,py,r*0.9,0,6.283); ctx.fill();
  });
  // rings, spreading from wherever you last put your weight down
  if(PROPS.ripples) for(const r of PROPS.ripples){
    const k=r.t/r.life, px=wx(r.x,1);
    const rad=lerp(12,lerp(230,540,r.s),easeOutCubic(k));
    const a=(1-k)*(1-k)*(0.10+0.26*r.s);
    if(a<0.005||px<-rad-200||px>VIEW_W+rad+200) continue;
    ctx.strokeStyle=hex(PT.rim,a); ctx.lineWidth=lerp(2.2,0.6,k);
    ctx.beginPath(); ctx.ellipse(px,hy,rad,rad*0.155,0,0,6.283); ctx.stroke();
  }
  ctx.restore();

  // the seam where the two halves of the world meet, held at a constant
  // thickness on screen however far back the camera goes
  const sh=us(28);
  const seam=ctx.createLinearGradient(0,hy-sh,0,hy+sh);
  seam.addColorStop(0,hex(PT.haze,0));
  seam.addColorStop(0.5,hex(PT.haze,0.13+S.light*0.26));
  seam.addColorStop(1,hex(PT.haze,0));
  ctx.fillStyle=seam; ctx.fillRect(0,hy-sh,VIEW_W,sh*2);
}

/* The soft light on the horizon: not a sun, not a goal marker counting down.
   Just somewhere to walk, which turns out to be enough. */
function drawShoreLight(){
  const hy=horizonY(), beat=0.5+0.5*Math.sin(S.t*0.5);
  // A horizon is not a place you can overtake. While there is water left to
  // cross the light sits far ahead; as you arrive it comes down to meet you.
  // The establishing shot is the exception: there it is where it says it is.
  const far=clamp((L.goalX-player.x)/2400,0,1);
  const px=S.intro>0?wx(L.goalX,1):lerp(wx(player.x,1)+VIEW_W*0.055,VIEW_W*0.80,smooth(far));
  const R=VIEW_W*lerp(0.13,0.42,S.light)*(1+0.035*beat);
  const a=0.30+S.light*0.50;
  const g=ctx.createRadialGradient(px,hy,0,px,hy,R);
  g.addColorStop(0,hex('#FFFFFF',a));
  g.addColorStop(0.13,hex(L.paint.skyFloor,a*0.46));
  g.addColorStop(0.48,hex(L.paint.skyDusk,a*0.15));
  g.addColorStop(1,hex(L.paint.skyDusk,0));
  ctx.fillStyle=g; fillSeen();

  // the light it lays across the water: a soft pool with no edges, broken up
  // by the swell into slow glints
  ctx.save(); clipWater(hy);
  const PR=R*1.15;
  ctx.save(); ctx.translate(px,hy); ctx.scale(1,2.2);
  const pool=ctx.createRadialGradient(0,0,0,0,0,PR);
  pool.addColorStop(0,hex('#FFFFFF',0.15+S.light*0.22));
  pool.addColorStop(0.34,hex('#FFFFFF',0.055+S.light*0.10));
  pool.addColorStop(1,hex('#FFFFFF',0));
  ctx.fillStyle=pool; ctx.fillRect(-px-300,0,VIEW_W+600,(VIEW_H-hy+400)/2.2);
  ctx.restore();
  // uneven, and soft at both ends, so they read as swell rather than as rungs
  const bot=VIEW_H+200;
  for(let i=0;i<12;i++){
    const j=(Math.sin(i*12.9898)*0.5+0.5);
    const t=clamp((i+0.35+j*0.55)/12,0,1);
    const yy=hy+Math.pow(t,1.7)*(bot-hy);
    const w=lerp(R*0.22,R*1.05,t)*(0.7+0.55*j);
    const aa=(0.05+S.light*0.07)*(1-t*0.85)*(0.35+0.65*Math.abs(Math.sin(S.t*0.9+i*1.3)));
    const gx=px+Math.sin(S.t*0.6+i*0.8)*w*0.10;
    const gg=ctx.createLinearGradient(gx-w/2,0,gx+w/2,0);
    gg.addColorStop(0,hex('#FFFFFF',0)); gg.addColorStop(0.5,hex('#FFFFFF',aa));
    gg.addColorStop(1,hex('#FFFFFF',0));
    ctx.fillStyle=gg; ctx.fillRect(gx-w/2,yy,w,us(2));
  }
  ctx.restore();
}

/* The obsidian mirror. Everything you built to outlive you, playing back on a
   surface that does not care either way. */
function drawMonolith(){
  if(L.monoX===undefined) return;
  const hy=horizonY(), px=wx(L.monoX,1);
  if(px<-900||px>VIEW_W+900) return;
  const gone=S.flood, solid=1-gone;
  const w=MONO_W, h=MONO_H, top=hy-h, split=easeOutCubic(S.crack)*22;
  const half=(dir,fn)=>{ ctx.save(); ctx.translate(dir*split,0); fn(); ctx.restore(); };
  const facePath=(x0,x1)=>{ ctx.beginPath(); ctx.rect(px+x0,top,x1-x0,h); };

  if(solid>0.01){
    // its reflection first — as tall as the thing itself, and less certain
    ctx.save(); clipWater(hy); ctx.globalAlpha=0.34*solid;
    const rg=ctx.createLinearGradient(0,hy,0,hy+h*0.85);
    rg.addColorStop(0,hex('#0b0b12',0.95)); rg.addColorStop(1,hex('#0b0b12',0));
    ctx.fillStyle=rg;
    ctx.fillRect(px-w/2+Math.sin(S.t*0.8)*2,hy,w,h*0.85);
    ctx.restore();

    ctx.save(); ctx.globalAlpha=solid;
    for(const d of [-1,1]) half(d,()=>{
      const x0=d<0?-w/2:0, x1=d<0?0:w/2;
      facePath(x0,x1);
      const bg=ctx.createLinearGradient(px,top,px,hy);
      bg.addColorStop(0,'#07070c'); bg.addColorStop(1,'#0d0d16');
      ctx.fillStyle=bg; ctx.fill();
    });
    // the montage, held inside the stone
    const mont=clamp(inv(760,300,Math.abs(player.x-L.monoX)),0,1)*solid;
    if(mont>0.01){
      ctx.save();
      facePath(-w/2-split,w/2+split); ctx.clip();
      const band=h*0.30, total=band*6, scroll=(S.t*13)%total;
      for(let k=0;k<8;k++){
        const y=top+h-(((k*band+scroll)%total));
        const fade=smooth(inv(top-30,top+h*0.22,y))*(1-smooth(inv(top+h*0.74,top+h+30,y)));
        if(fade>0.01) armorGhost(k%6,px,y,w*0.62,mont*fade*0.55);
      }
      ctx.restore();
    }
    // the outer edge only — an unbroken wall has no seam down its middle.
    // Squared, so the structure goes before the light does.
    ctx.save(); ctx.globalAlpha=solid*solid;
    ctx.strokeStyle=hex('#CFE3F5',0.20); ctx.lineWidth=1.2;
    for(const d of [-1,1]) half(d,()=>{
      const inner=px+(d<0?0:0), outer=px+d*w/2;
      ctx.beginPath(); ctx.moveTo(inner,top); ctx.lineTo(outer,top);
      ctx.lineTo(outer,hy); ctx.lineTo(inner,hy); ctx.stroke();
    });
    ctx.restore();
    // The light coming out of the split, opening from the middle outwards —
    // and then taking the whole wall with it, rather than leaving a pillar.
    if(S.crack>0.001){
      const c=smooth(S.crack), y0=top+lerp(h*0.5,0,c), hh=h*lerp(0.02,1,c);
      ctx.save(); ctx.globalAlpha=solid;
      ctx.shadowColor='#FFF6CF'; ctx.shadowBlur=34*S.crack;
      // a hard blade of light while it is still a wall with a split in it
      if(gone<0.98){
        const cw=us(2.4)+split*1.8;
        const cg=ctx.createLinearGradient(0,y0,0,y0+hh);
        cg.addColorStop(0,hex('#FFF6CF',0.70*S.crack*(1-gone)));
        cg.addColorStop(0.7,hex('#FFFFFF',0.92*S.crack*(1-gone)));
        cg.addColorStop(1,hex('#FFFFFF',0.98*S.crack*(1-gone)));
        ctx.fillStyle=cg; ctx.fillRect(px-cw/2,y0,cw,hh);
      }
      // and then no edges at all, because it is not a wall any more
      if(gone>0.01){
        ctx.save(); ctx.translate(px,y0+hh*0.58); ctx.scale(1,hh/(w*0.9));
        const rg=ctx.createRadialGradient(0,0,0,0,0,w*0.9);
        rg.addColorStop(0,hex('#FFFFFF',0.85*gone));
        rg.addColorStop(0.42,hex('#FFF6CF',0.42*gone));
        rg.addColorStop(1,hex('#FFF6CF',0));
        ctx.fillStyle=rg; ctx.fillRect(-w*0.9,-w*0.9,w*1.8,w*1.8);
        ctx.restore();
      }
      ctx.restore();
    }
    ctx.restore();
  }

  // and then it is not a wall any more: liquid light, spilling over the mirror
  // and, over the following minute, simply becoming part of the water
  if(gone>0&&S.act!=='rise'&&S.act!=='epilogue'&&S.act!=='over'){
    const f=easeOutCubic(gone), R=lerp(80,2600,f);
    const settle=S.act==='dissolve'?1:clamp(1-S.actT/7,0,1);
    if(settle>0.002){
      ctx.save(); clipWater(hy); ctx.globalAlpha=settle;
      const g=ctx.createRadialGradient(px,hy,0,px,hy,R);
      g.addColorStop(0,hex('#FFFFFF',0.55*(1-f*0.45)));
      g.addColorStop(0.20,hex('#FFF6CF',0.30*(1-f*0.5)));
      g.addColorStop(0.58,hex('#FFD700',0.09*(1-f*0.6)));
      g.addColorStop(1,hex('#FFD700',0));
      ctx.fillStyle=g; ctx.fillRect(-300,hy-60,VIEW_W+600,VIEW_H-hy+400);
      // rings of it going out across the mirror
      for(let i=0;i<3;i++){
        const k=clamp(gone*1.7-i*0.3,0,1);
        if(k<=0.02||k>=1) continue;
        const rad=lerp(50,1700,easeOutCubic(k));
        ctx.strokeStyle=hex('#FFF6CF',(1-k)*0.45); ctx.lineWidth=lerp(3.4,1,k);
        ctx.beginPath(); ctx.ellipse(px,hy,rad,rad*0.155,0,0,6.283); ctx.stroke();
      }
      ctx.restore();
      const sg=ctx.createRadialGradient(px,hy,0,px,hy,R*0.8);
      sg.addColorStop(0,hex('#FFF6CF',0.24*(1-f)*settle));
      sg.addColorStop(1,hex('#FFD700',0));
      ctx.fillStyle=sg; ctx.fillRect(-300,Math.max(-300,hy-R),VIEW_W+600,Math.min(R,hy+300));
    }
  }
}

/* Six projects of meaning, reduced to the shape each one left behind. */
function armorGhost(i,px,cy,W,a){
  const K=['#00F0FF','#FFB703','#E63946','#FB8500','#FFD700','#00FF66'][i];
  ctx.save(); ctx.globalAlpha=a;
  ctx.strokeStyle=hex(K,0.9); ctx.fillStyle=hex(K,0.55); ctx.lineWidth=1.5;
  ctx.shadowColor=hex(K,0.7); ctx.shadowBlur=8;
  const x0=px-W/2;
  if(i===0){                                    // the climb, still going up
    ctx.beginPath();
    for(let k=0;k<4;k++){ const x=x0+k*(W/3), y=cy+14-k*9; k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    for(let k=0;k<4;k++){ const x=x0+k*(W/3), y=cy+14-k*9;
      ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x+5,y); ctx.lineTo(x,y+5); ctx.lineTo(x-5,y);
      ctx.closePath(); ctx.fill(); }
  } else if(i===1){                             // the routine, one step per day
    for(let k=0;k<4;k++) ctx.strokeRect(x0+k*(W/4),cy+14-k*8,W/4-3,6);
  } else if(i===2){                             // the dogma, sorted into two kinds
    for(let k=0;k<4;k++){ const x=x0+k*(W/4)+3;
      if(k%2) ctx.strokeRect(x,cy-9,W/6,18);
      else { ctx.beginPath(); ctx.arc(x+W/12,cy,7,0,6.283); ctx.stroke(); } }
  } else if(i===3){                             // the refuge, two lights in a ring
    ctx.beginPath(); ctx.arc(px,cy,W*0.32,0,6.283); ctx.stroke();
    for(const d of [-9,9]){ ctx.beginPath(); ctx.arc(px+d,cy+4,3.2,0,6.283); ctx.fill(); }
  } else if(i===4){                             // the creation, a line that stops
    ctx.beginPath(); ctx.moveTo(x0,cy+10);
    for(let k=1;k<=10;k++) ctx.lineTo(x0+k*(W/10),cy+10-Math.sin(k*0.8)*8-k*0.6);
    ctx.stroke();
  } else {                                      // the archive, a blueprint of the cage
    ctx.lineWidth=1;
    for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(x0,cy-9+k*6); ctx.lineTo(x0+W,cy-9+k*6); ctx.stroke(); }
    for(let k=0;k<5;k++){ ctx.beginPath(); ctx.moveTo(x0+k*(W/4),cy-9); ctx.lineTo(x0+k*(W/4),cy+9); ctx.stroke(); }
  }
  ctx.restore();
}

/* The skyline, each block counting down to its own collapse. */
function drawTowers(sun){
  if(!PROPS.towers) return;
  for(const t of PROPS.towers){
    const px=wx(t.x,0.62), base=wy(terrainYSafe(t.x),0.62);
    if(px<-320||px>VIEW_W+320) continue;
    ctx.fillStyle=mixHex('#232b33',L.paint.night,sun*0.55);
    ctx.fillRect(px-t.w/2,base-t.h,t.w,t.h);
    // a very few lit windows; nobody is home in most of them
    ctx.fillStyle=hex('#CBD5E1',0.05+t.win*0.05);
    for(let y=base-t.h+16;y<base-16;y+=26)
      for(let x=px-t.w/2+9;x<px+t.w/2-9;x+=20)
        if(((x*7+y*3)|0)%5===0) ctx.fillRect(x,y,7,11);
    // ivy taking it back
    ctx.strokeStyle=hex('#3A5A40',0.30); ctx.lineWidth=2;
    ctx.beginPath();
    for(let y=base;y>base-t.h*0.55;y-=14) ctx.lineTo(px-t.w/2+Math.sin(y*0.06+t.x)*7,y);
    ctx.stroke();
    setFont(ctx,400,11,MONO,'0.14em'); ctx.textAlign='center';
    ctx.fillStyle=hex('#CBD5E1',0.24);
    ctx.fillText(`${t.tag} · ${Math.round(t.yrs)} YRS`,px,base-t.h-16);
    clearSpace(ctx);
  }
}

/* Thousands of people, each sealed inside their own head, passing in silence. */
function drawCrowd(sun){
  if(!PROPS.crowd||!PROPS.crowd.length) return;
  for(const c of PROPS.crowd){
    const x=c.x+S.t*c.sp;
    const span=4900, wrapped=((x+1500)%span+span)%span-1500;
    const px=wx(wrapped,1), py=wy(terrainYSafe(wrapped),1);
    if(px<-40||px>VIEW_W+40) continue;
    const bob=Math.sin(S.t*2.4+c.ph)*1.6;
    ctx.fillStyle=hex('#CBD5E1',c.a);
    ctx.fillRect(px-2.5,py-c.h+bob,5,c.h*0.66);
    ctx.beginPath(); ctx.arc(px,py-c.h+bob-3,4,0,6.283); ctx.fill();
  }
}

/* Colossal names, and how long until nobody can recall them. */
function drawStatues(sun){
  if(!PROPS.statues||!PROPS.statues.length) return;
  for(const st of PROPS.statues){
    const px=wx(st.x,1), base=wy(terrainYSafe(st.x),1);
    if(px<-260||px>VIEW_W+260) continue;
    const erode=clamp(1-st.yrs/1400,0,1);
    ctx.save(); ctx.translate(px,base); ctx.rotate(st.lean);
    ctx.fillStyle=mixHex('#4A4E69',L.paint.night,sun*0.5);
    ctx.fillRect(-st.w*0.75,-18,st.w*1.5,18);                 // plinth
    ctx.fillStyle=mixHex('#9A8C98',L.paint.night,sun*0.5+erode*0.35);
    ctx.fillRect(-st.w/2,-st.h,st.w,st.h-18);                 // body
    if(erode<0.7){ ctx.beginPath(); ctx.arc(0,-st.h-st.w*0.34,st.w*0.34,0,6.283); ctx.fill(); }
    // dust coming off it, continuously
    ctx.fillStyle=hex('#F2E9E4',0.05);
    for(let i=0;i<7;i++){
      const yy=-st.h+((S.t*13+i*40+st.x)%st.h);
      ctx.fillRect(st.w/2+Math.sin(yy*0.2)*5,-yy,1.5,1.5);
    }
    ctx.restore();
    setFont(ctx,400,11,MONO,'0.14em'); ctx.textAlign='center';
    ctx.fillStyle=hex('#F2E9E4',0.26);
    ctx.fillText(`${st.tag} · FORGOTTEN IN ${Math.round(st.yrs)} YRS`,px,base-st.h-30);
    clearSpace(ctx);
  }
}

/* The blockade. Impassable until an ideology removes it, and the arch above
   is resting on it. */
function drawRubble(sun){
  if(!L.rubble) return;
  for(let k=0;k<L.rubble.length;k++){
    const bx=L.rubble[k];
    const px=wx(bx,1), base=wy(terrainYSafe(bx),1);
    if(px<-280||px>VIEW_W+280) continue;
    const r=mulberry32(91+k*13);
    if(!S.cleared.has(bx)){
      ctx.fillStyle=mixHex('#2a323a',L.paint.night,sun*0.6);
      for(let i=0;i<24;i++){
        const w=lerp(14,40,r()), h=lerp(10,30,r());
        ctx.fillRect(px-52+r()*104-w/2, base-h-r()*146, w, h);
      }
      ctx.strokeStyle=hex('#A3B18A',0.22); ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(px-58,base); ctx.lineTo(px-28,base-146);
      ctx.lineTo(px+38,base-126); ctx.lineTo(px+60,base); ctx.stroke();
    } else {
      // what fell afterwards, lying across the road you were going to use
      ctx.fillStyle=mixHex('#1d242b',L.paint.night,sun*0.6);
      const o=lerp(60,140,r());
      ctx.beginPath(); ctx.moveTo(px+o,base); ctx.lineTo(px+o+58,base-lerp(140,230,r()));
      ctx.lineTo(px+o+150,base-lerp(120,200,r())); ctx.lineTo(px+o+126,base); ctx.closePath(); ctx.fill();
    }
  }
}

function drawGrass(sun){
  const w=0.6+0.4*Math.sin(S.t*0.21)+0.2*Math.sin(S.t*0.07);
  ctx.lineWidth=1.3; ctx.lineCap='round';
  for(const b of PROPS.grass){
    const px=wx(b.x,1);
    if(px<-20||px>VIEW_W+20) continue;
    const gy=terrainYSafe(b.x), py=wy(gy,1);
    const sway=Math.sin(S.t*1.5+b.ph+b.x*0.01)*7*w+b.lean*10+w*7;
    ctx.strokeStyle=hex(b.c>0.6?L.paint.rim:'#5d6b58',0.30+b.c*0.22);
    ctx.beginPath(); ctx.moveTo(px,py);
    ctx.quadraticCurveTo(px+sway*0.4,py-b.h*0.6,px+sway,py-b.h); ctx.stroke();
  }
}

function fmtDecay(s){
  if(s<=0) return '—';
  const m=Math.floor(s/60), ss=Math.floor(s%60);
  return m>0?`${String(m).padStart(2,'0')}m ${String(ss).padStart(2,'0')}s`:`${String(ss).padStart(2,'0')}s`;
}
function drawFlowers(sun){
  for(const f of PROPS.flowers){
    const px=wx(f.x,1);
    if(px<-60||px>VIEW_W+60) continue;
    const gy=terrainYSafe(f.x), py=wy(gy,1);
    const life=f.t/f.max;                      // 1 -> 0, blooming to gone
    const sway=Math.sin(S.t*1.2+f.x*0.02)*4;
    const h=lerp(9,26,clamp(life*1.4,0,1));
    ctx.strokeStyle=hex(life>0?'#5d6b58':'#3a3a34',0.55);
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px,py);
    ctx.quadraticCurveTo(px+sway*0.5,py-h*0.6,px+sway,py-h); ctx.stroke();
    if(life>0.02){
      const pr=lerp(1.4,4.2,clamp(life,0,1));
      for(let i=0;i<5;i++){
        const a=i/5*6.283+S.t*0.06;
        ctx.fillStyle=`hsla(${f.hue},${Math.round(52*life)}%,${Math.round(52+18*life)}%,${0.30+0.45*life})`;
        ctx.beginPath(); ctx.arc(px+sway+Math.cos(a)*pr,py-h+Math.sin(a)*pr,pr*0.82,0,6.283); ctx.fill();
      }
    }
    setFont(ctx,400,10,MONO,'0.12em'); ctx.textAlign='center';
    ctx.fillStyle=hex(life>0?L.paint.mote:'#7a7a72',life>0?0.30:0.16);
    ctx.fillText(fmtDecay(f.t),px+sway,py-h-13);
    clearSpace(ctx);
  }
}
function drawMotes(){
  const w=0.6+0.4*Math.sin(S.t*0.21);
  for(const m of motes){
    const sp=(30+m.z*70)*w;
    const x=((m.x+S.t*sp)%5000+5000)%5000-1600;
    const px=wx(x,0.55+m.z*0.45), py=wy(m.y+Math.sin(S.t*0.6+m.ph)*22,0.55+m.z*0.45);
    if(px<-20||px>VIEW_W+20) continue;
    ctx.fillStyle=hex(L.paint.mote,0.05+m.z*0.10);
    ctx.beginPath(); ctx.arc(px,py,m.s*m.z,0,6.283); ctx.fill();
  }
}

/* There is one figure in this game and it never changes shape. Legs, a torso,
   a head: the same small animal on both sides of every cut. What changes is
   how it is lit and whether it is shaking. */
function playerBody(g,px,py,H){
  const k=H/34;
  g.fillRect(px-4.5*k,py-H*0.44,3*k,H*0.44);      // legs
  g.fillRect(px+1.5*k,py-H*0.44,3*k,H*0.44);
  g.beginPath();                                   // torso
  g.moveTo(px-5*k,py-H*0.42); g.lineTo(px-4*k,py-H*0.86);
  g.lineTo(px+4*k,py-H*0.86); g.lineTo(px+5*k,py-H*0.42); g.closePath(); g.fill();
  g.beginPath(); g.arc(px,py-H*0.96,4.4*k,0,6.283); g.fill();   // head
}

/* The same body inside the blinders: flat, hard-edged, haloed in the armour's
   own colour, and — the entire sales pitch, in one detail — perfectly still.
   Not a token. Not an arrow. You, with the trembling turned off. */
function armorFigure(g,px,py,H,key,lean){
  g.save();
  if(lean){ g.translate(px,py); g.rotate(clamp(lean,-1,1)*0.10); g.translate(-px,-py); }
  g.shadowColor=hex(key,0.95); g.shadowBlur=20;
  g.fillStyle='#FFFFFF';
  playerBody(g,px,py,H);
  playerBody(g,px,py,H);          // twice, so the halo builds to the armour's key
  g.restore();
}

function drawPlayerRaw(){
  const tr=player.tremor*(1+S.dread*0.9);
  const jx=(Math.random()-0.5)*tr*2.4, jy=(Math.random()-0.5)*tr*2.0;
  const px=wx(player.x,1)+jx, py=wy(player.y,1)+jy;
  const kneel=player.kneel;
  const H=lerp(34,20,kneel);

  // on the water there is a second one of you, standing on nothing
  if(L.shore){
    const hy=horizonY();
    ctx.save();
    ctx.translate(Math.sin(S.t*1.4)*1.4,2*hy); ctx.scale(1,-1);
    ctx.globalAlpha=0.30; ctx.fillStyle=hex('#F8FAFC',0.9);
    playerBody(ctx,px,py,H*0.94);
    ctx.restore();
  }

  // the glow of a small, self-aware thing
  const g=ctx.createRadialGradient(px,py-H*0.55,0,px,py-H*0.55,86);
  g.addColorStop(0,hex('#F8FAFC',0.30)); g.addColorStop(0.35,hex('#F8FAFC',0.09)); g.addColorStop(1,hex('#F8FAFC',0));
  ctx.fillStyle=g; ctx.fillRect(px-90,py-H-90,180,180);

  ctx.fillStyle=hex('#F8FAFC',0.94);
  playerBody(ctx,px,py,H);
  // long shadow — the water takes care of its own
  if(!L.shore){
    ctx.fillStyle=hex('#000000',0.28);
    ctx.beginPath(); ctx.ellipse(px,py+1.5,13,3,0,0,6.283); ctx.fill();
  }
}

function drawDreadVignette(){
  const d=Math.max(S.dread,S.collapsed>0?0.96:0);
  if(d<0.02) return;
  const g=ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,VIEW_H*lerp(0.62,0.16,d),VIEW_W/2,VIEW_H/2,VIEW_H*0.95);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${(0.30+d*0.66).toFixed(3)})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  if(d>0.55){ // the world goes quiet and colourless as it closes in
    ctx.save(); ctx.globalCompositeOperation='saturation';
    ctx.globalAlpha=(d-0.55)/0.45*0.5; ctx.fillStyle='hsl(0,0%,50%)';
    ctx.fillRect(0,0,VIEW_W,VIEW_H); ctx.restore();
  }
}

/* ---------------------------------------------------- the armored states - */
/* These add their shape to whatever path is already open rather than starting a
   new one, because the same shape has to be able to cut a hole in the blinder
   (rect + aperture, filled even-odd) as well as be clipped or stroked alone.
   Beginning a path in here quietly threw the outer rect away and filled the
   aperture itself with black, which blacked out the entire armoured view. */
function aperture(g,cx,cy,w,h,notch){
  g.moveTo(cx-w/2,cy);
  g.lineTo(cx-w/2+notch,cy-h/2);
  g.lineTo(cx+w/2-notch,cy-h/2);
  g.lineTo(cx+w/2,cy);
  g.lineTo(cx+w/2-notch,cy+h/2);
  g.lineTo(cx-w/2+notch,cy+h/2);
  g.closePath();
}
function apertureRect(g,cx,cy,w,h,r){
  if(g.roundRect) g.roundRect(cx-w/2,cy-h/2,w,h,r);
  else g.rect(cx-w/2,cy-h/2,w,h);
}

function drawArmored(g,which,open,alpha){
  open=open===undefined?1:open; alpha=alpha===undefined?1:alpha;
  const A=ARMORS[which];
  g.save(); g.globalAlpha=alpha;
  g.fillStyle=A.dark; g.fillRect(0,0,VIEW_W,VIEW_H);

  const pxS=wx(player.x,1), pyS=wy(player.y,1);
  const cx=VIEW_W*0.5;
  const pad=(which==='archive')?S.archTrack[S.archIdx]:null;
  const anchor=(which==='climb'&&S.baseY!==undefined)?wy(S.baseY,1)-VIEW_H*0.22
              :pad?wy(pad.y,1)-VIEW_H*0.16:pyS-46;
  const cy=clamp(anchor,VIEW_H*0.28,VIEW_H*0.72);

  const apPath=()=>{
    if(which==='climb') aperture(g,cx,cy,VIEW_W*1.02*open,VIEW_H*0.66*open,VIEW_W*0.15);
    else if(which==='dogma') aperture(g,cx,cy,VIEW_W*1.02*open,VIEW_H*0.44*open,VIEW_W*0.17);
    // moveTo first, or the circle is joined to the rect by a stray line.
    // For the refuge the blinder is the ring: outside somebody else's light
    // there is not a darker version of the world, there is no world.
    else if(which==='refuge'){
      const C=S.companion, live=C&&!C.gone;
      const rx=live?wx(C.x,1):pxS, ry=(live?wy(C.y,1):pyS)-40, r=refugeRing()*open;
      g.moveTo(rx+r,ry); g.arc(rx,ry,r,0,6.283);
    }
    else if(which==='creation') apertureRect(g,cx,cy,VIEW_W*0.92*open,VIEW_H*0.70*open,26);
    else apertureRect(g,cx,cy,VIEW_W*0.88*open,VIEW_H*0.66*open,18);
  };
  g.save(); g.beginPath(); apPath(); g.clip();
  if(which==='climb') drawClimbInner(g);
  else if(which==='routine') drawRoutineInner(g);
  else if(which==='dogma') drawDogmaInner(g);
  else if(which==='refuge') drawRefugeInner(g);
  else if(which==='creation') drawCreationInner(g);
  else drawArchiveInner(g);
  g.restore();

  // pitch-black blinders outside the aperture — 90% of the world, gone
  g.beginPath(); g.rect(0,0,VIEW_W,VIEW_H); apPath();
  g.fillStyle=A.dark; g.fill('evenodd');

  // the hard edge of the blinder
  g.lineWidth=1.2; g.strokeStyle=hex(A.key,0.30);
  g.beginPath(); apPath(); g.stroke();

  // and you, always, even when you have walked out of the light
  if(which==='refuge') armorFigure(g,pxS,pyS,34,ARMORS.refuge.key,player.vx/REFUGE_V);

  drawArmorHUD(g,which);
  g.restore();
}

function drawClimbInner(g){
  const K=P.climb.cyan;
  // faint background lattice: the world reduced to a grid you can win on
  g.lineWidth=1; g.strokeStyle=hex(K,0.055);
  const step=64, ox=-((cam.x*0.5)%step), oy=-((cam.y*0.5)%step);
  g.beginPath();
  for(let x=ox;x<VIEW_W+step;x+=step){ g.moveTo(x,0); g.lineTo(x,VIEW_H); }
  for(let y=oy;y<VIEW_H+step;y+=step){ g.moveTo(0,y); g.lineTo(VIEW_W,y); }
  g.stroke();

  const C=S.course;
  if(!C||!C.length) return;

  // the rungs. The last one is the only one that is anywhere.
  for(const p of C){
    const px=wx(platX(p),1), py=wy(p.y,1);
    if(px<-300||px>VIEW_W+300) continue;
    g.save();
    g.shadowColor=hex(K,0.9); g.shadowBlur=p.exit?26:14;
    if(p.exit){
      const beat=0.5+0.5*Math.sin(S.t*3);
      g.fillStyle=hex('#FFFFFF',0.55+beat*0.25);
      g.fillRect(px-p.w/2,py,p.w,PLAT_H);
      const beam=g.createLinearGradient(0,py,0,py+VIEW_H*0.5);
      beam.addColorStop(0,hex(K,0.20)); beam.addColorStop(1,hex(K,0));
      g.fillStyle=beam; g.fillRect(px-p.w/2,py+PLAT_H,p.w,VIEW_H*0.5);
    } else {
      g.fillStyle=hex(K,0.30);
      g.fillRect(px-p.w/2,py,p.w,PLAT_H);
      g.strokeStyle=hex(K,0.95); g.lineWidth=1.8;
      g.strokeRect(px-p.w/2,py,p.w,PLAT_H);
      // the supports, running down into nothing
      g.strokeStyle=hex(K,0.14); g.lineWidth=1;
      g.beginPath(); g.moveTo(px,py+PLAT_H); g.lineTo(px,py+PLAT_H+70); g.stroke();
    }
    g.restore();
    if(p.exit){
      setFont(g,400,11,MONO,'0.22em'); g.textAlign='center';
      g.fillStyle=hex('#FFFFFF',0.55);
      g.fillText('THE NEXT LEVEL',px,py-16); clearSpace(g);
    }
  }

  /* The cut line, coming up from underneath at exactly the rate the clock in
     the corner runs down. It is the only honest thing on this screen: it says,
     without any euphemism at all, that you cannot stay where you are. */
  const fy=wy(climbFloor(),1);
  if(fy<VIEW_H+60){
    const gd=g.createLinearGradient(0,fy,0,fy+VIEW_H*0.45);
    gd.addColorStop(0,hex(K,0.22)); gd.addColorStop(0.18,'rgba(0,0,0,0.88)'); gd.addColorStop(1,'#000');
    g.fillStyle=gd; g.fillRect(-40,fy,VIEW_W+80,VIEW_H+200);
    g.strokeStyle=hex(K,0.12); g.lineWidth=1;
    g.beginPath();
    const hs=26, ho=-((S.t*24)%hs);
    for(let x=ho-hs;x<VIEW_W+hs;x+=hs){ g.moveTo(x,fy+hs); g.lineTo(x+hs,fy); }
    g.stroke();
    g.save(); g.shadowColor=hex('#FF4A4A',0.8); g.shadowBlur=16;
    g.strokeStyle=hex('#FF4A4A',0.42+0.34*Math.abs(Math.sin(S.t*2.6)));
    g.lineWidth=1.8; g.beginPath(); g.moveTo(-40,fy); g.lineTo(VIEW_W+40,fy); g.stroke();
    g.restore();
    // named in the empty water below it, where there is never a rung to collide with
    setFont(g,400,us(10),MONO,'0.26em'); g.textAlign='right';
    g.fillStyle=hex('#FF4A4A',0.46);
    g.fillText('CUT LINE',VIEW_W*0.80,fy+us(19)); clearSpace(g);
  }

  // the player: the same body as out there, not trembling, and lit like a target
  const px=wx(player.x,1), py=wy(player.y,1);
  armorFigure(g,px,py,36,K,player.vx/RUN);
  // and the line of the jump you are in the middle of
  if(!S.onPlat){
    g.strokeStyle=hex(K,0.28); g.lineWidth=1; g.setLineDash([3,5]);
    g.beginPath(); g.moveTo(px,py); g.lineTo(px,py+90); g.stroke(); g.setLineDash([]);
  }
}

function drawRoutineInner(g){
  const K=P.routine.amber, G=P.routine.gold;
  // muted grid — the shape of a day
  g.lineWidth=1; g.strokeStyle=hex(K,0.06);
  const step=48, ox0=-((cam.x)%step), oy0=-((cam.y)%step);
  g.beginPath();
  for(let x=ox0;x<VIEW_W+step;x+=step){ g.moveTo(x,0); g.lineTo(x,VIEW_H); }
  for(let y=oy0;y<VIEW_H+step;y+=step){ g.moveTo(0,y); g.lineTo(VIEW_W,y); }
  g.stroke();

  const RT=S.routineTrack;
  if(!RT.length) return;
  /* The staircase has its own space. It has to: the whole point of it is that
     it looks the same everywhere, whatever the ground underneath is doing. */
  const cur=RT[RT.length-1], prev=RT.length>1?RT[RT.length-2]:cur;
  const e=smooth(clamp(S.stepAnim,0,1));
  const px=VIEW_W*0.46, py=VIEW_H*0.64;
  const ox=px-lerp(prev.vx,cur.vx,e), oy=py-lerp(prev.vy,cur.vy,e);
  const w=78, d=15;

  const drawStep=(x,y,a,ghost,ground)=>{
    g.save(); g.globalAlpha=a;
    g.shadowColor=hex(K,0.55); g.shadowBlur=ghost?4:12;
    g.fillStyle=hex(ghost?K:G,ghost?0.06:0.20);
    g.beginPath(); g.moveTo(x-w/2,y); g.lineTo(x-w/2+d,y-d); g.lineTo(x+w/2+d,y-d); g.lineTo(x+w/2,y); g.closePath(); g.fill();
    g.lineWidth=ghost?1.2:1.6; g.strokeStyle=hex(ghost?K:G,ghost?0.28:0.85); g.stroke();
    g.fillStyle=hex(K,ghost?0.03:0.11);
    g.beginPath(); g.moveTo(x-w/2,y); g.lineTo(x+w/2,y); g.lineTo(x+w/2,y+30); g.lineTo(x-w/2,y+30); g.closePath(); g.fill();
    // the only thing the armour will tell you about the world it is covering:
    // whether this particular morning had anything underneath it
    if(!ghost&&ground){
      // there was something under that one. The armour will not tell you what
      // it means, and by now you may have stopped noticing it at all.
      g.shadowColor=hex(G,0.9); g.shadowBlur=10;
      g.strokeStyle=hex(G,0.8); g.lineWidth=3;
      g.beginPath(); g.moveTo(x-w/2+2,y+32); g.lineTo(x+w/2+2,y+32); g.stroke();
    }
    g.restore();
  };

  for(const st of RT){
    const x=ox+st.vx, y=oy+st.vy;
    if(x<-200||x>VIEW_W+200) continue;
    drawStep(x,y,1,false,st.ground);
  }
  // tomorrow, which is exactly like today
  if(!S.routineEnd) drawStep(ox+cur.vx+STAIR_DX,oy+cur.vy+STAIR_DY,0.75,true,false);

  // the beat you are trying to keep: a ring that closes on every tick
  const ph=1-clamp(S.beatT/Math.max(S.beatDur,0.01),0,1);
  g.save();
  g.lineWidth=2; g.strokeStyle=hex(G,0.16+0.5*ph);
  g.beginPath(); g.arc(px,py-24,lerp(58,16,ph),0,6.283); g.stroke();
  if(S.beatHit>0){
    g.lineWidth=3; g.strokeStyle=hex('#FFF3DA',S.beatHit*0.9);
    g.beginPath(); g.arc(px,py-24,20+(1-S.beatHit)*26,0,6.283); g.stroke();
  }
  g.restore();

  armorFigure(g,px,py,36,G,0);
}

/* ------------------------------------------------------------- THE DOGMA */
function drawDogmaInner(g){
  const K=ARMORS.dogma.key, W='#FFFFFF', T=S.dogmaTrack;
  const px=wx(player.x,1), py=wy(player.y,1);
  const spd=clamp(S.dogV/DOG_VMAX,0,1);

  // uprights, going past
  g.lineWidth=1; g.strokeStyle=hex(W,0.045);
  const step=110, ox=-(cam.x%step);
  g.beginPath();
  for(let x=ox;x<VIEW_W+step;x+=step){ g.moveTo(x,0); g.lineTo(x,VIEW_H); }
  g.stroke();

  // speed, which is the only quantity this armour is really interested in
  g.strokeStyle=hex(W,0.04+0.20*spd); g.lineWidth=1.6;
  g.beginPath();
  for(let i=0;i<18;i++){
    const yy=py-18-((i*67+S.t*140*spd)%340);
    const len=lerp(30,260,spd)*(0.4+((i*37)%11)/18);
    const xx=((i*233+S.t*1100*spd)%(VIEW_W+500))-250;
    g.moveTo(xx,yy); g.lineTo(xx-len,yy);
  }
  g.stroke();

  // the road
  g.save(); g.shadowColor=hex(W,0.5); g.shadowBlur=10;
  g.strokeStyle=hex(W,0.55); g.lineWidth=2;
  g.beginPath(); g.moveTo(-40,py); g.lineTo(VIEW_W+40,py); g.stroke(); g.restore();

  // the things in the road, which are all one kind of thing in here
  for(const o of T){
    const bx=wx(o.x,1);
    if(bx<-200||bx>VIEW_W+200) continue;
    if(o.dead){
      g.save(); g.globalAlpha=0.13;
      g.fillStyle=hex(K,0.5); g.strokeStyle=hex(K,0.8); g.lineWidth=1.6;
      g.fillRect(bx-30,py-92,60,92); g.strokeRect(bx-30,py-92,60,92); g.restore();
    } else {
      const near=clamp(1-(o.x-player.x)/640,0,1);
      g.save(); g.shadowColor=hex(K,0.95); g.shadowBlur=8+20*near;
      g.fillStyle=hex(K,0.26+0.30*near); g.strokeStyle=hex(K,1); g.lineWidth=2.6;
      g.fillRect(bx-34,py-104,68,104); g.strokeRect(bx-34,py-104,68,104);
      g.fillStyle=hex(W,0.65); g.fillRect(bx-34,py-104,68,4);
      g.restore();
    }
  }

  /* The strike window. The one measurement offered in here, and it is a
     measurement of how close a thing has to be before you are allowed to
     destroy it — never of what it is. */
  if(!S.stranded){
    const wEnd=px+DOG_WIN;
    g.save(); g.strokeStyle=hex(K,0.22+0.2*S.dogSwing); g.lineWidth=1.4;
    g.setLineDash([5,7]);
    g.beginPath(); g.moveTo(wEnd,py-120); g.lineTo(wEnd,py+14); g.stroke();
    g.setLineDash([]);
    g.strokeStyle=hex(K,0.16); g.beginPath();
    g.moveTo(px,py+10); g.lineTo(wEnd,py+10); g.stroke();
    g.restore();
  }

  // the swing itself
  if(S.dogSwing>0.01){
    g.save(); g.globalAlpha=S.dogSwing;
    g.strokeStyle=hex(W,0.9); g.lineWidth=3; g.shadowColor=hex(W,0.9); g.shadowBlur=14;
    g.beginPath(); g.arc(px+18,py-46,52,-1.15,0.55); g.stroke(); g.restore();
  }
  if(S.dogFlash>0.01){
    g.fillStyle=hex(W,S.dogFlash*0.16); g.fillRect(0,0,VIEW_W,VIEW_H);
  }
  if(S.dogStall>0){
    g.fillStyle=hex(K,Math.min(0.30,S.dogStall*0.32)); g.fillRect(0,0,VIEW_W,VIEW_H);
    setFont(g,400,us(13),MONO,'0.30em'); g.textAlign='center';
    g.fillStyle=hex(W,0.55+0.3*Math.sin(S.t*18));
    g.fillText('STOPPED',VIEW_W/2,py-150); clearSpace(g);
  }

  armorFigure(g,px,py,36,K,spd*0.9);
}

/* ------------------------------------------------------------ THE REFUGE */
function drawRefugeInner(g){
  const K=ARMORS.refuge.key, G='#FFB703', C=S.companion;
  const px=wx(player.x,1), py=wy(player.y,1);
  const live=C&&!C.gone;
  const cxp=C?wx(C.x,1):px, cyp=C?wy(C.y,1):py;
  const ring=refugeRing();
  // The lit part of the world is a circle around somebody else.
  const gx=live?cxp:px, gy=(live?cyp:py)-40;
  const gr=g.createRadialGradient(gx,gy,10,gx,gy,ring);
  gr.addColorStop(0,hex(G,0.19)); gr.addColorStop(0.58,hex(K,0.07)); gr.addColorStop(1,hex(K,0));
  g.fillStyle=gr; g.fillRect(0,0,VIEW_W,VIEW_H);

  // the ground, only as far as the light goes
  g.save();
  g.beginPath(); g.arc(gx,gy,ring,0,6.283); g.clip();
  g.strokeStyle=hex(G,0.36); g.lineWidth=2;
  g.beginPath();
  for(let x=-200;x<VIEW_W+200;x+=14){
    const wxx=x+cam.x, yy=wy(terrainYSafe(wxx),1);
    if(x===-200) g.moveTo(x,yy); else g.lineTo(x,yy);
  }
  g.stroke();
  g.restore();

  if(live){
    const glow=g.createRadialGradient(cxp,cyp-26,0,cxp,cyp-26,88);
    glow.addColorStop(0,hex(G,0.52)); glow.addColorStop(1,hex(G,0));
    g.fillStyle=glow; g.fillRect(cxp-92,cyp-118,184,184);
    g.save(); g.shadowColor=hex(G,0.9); g.shadowBlur=14; g.fillStyle='#FFF3DA';
    playerBody(g,cxp,cyp,30); playerBody(g,cxp,cyp,30); g.restore();
    // the thread, going thin
    const t=clamp(S.thread/REFUGE_SLACK,0,1);
    g.save();
    g.strokeStyle=hex(S.refugeNear?G:'#FF8A5B',0.12+0.30*t);
    g.lineWidth=lerp(0.6,1.8,t);
    g.setLineDash([lerp(2,6,t),lerp(14,7,t)]);
    g.beginPath(); g.moveTo(px,py-22); g.lineTo(cxp,cyp-22); g.stroke();
    g.restore(); g.setLineDash([]);
    // outside it, the dark closes in at the rate the thread runs out
    if(!S.refugeNear){
      const v=g.createRadialGradient(px,py-40,VIEW_H*0.10,px,py-40,VIEW_H*0.62);
      v.addColorStop(0,'rgba(0,0,0,0)');
      v.addColorStop(1,`rgba(0,0,0,${(0.30+0.55*(1-t)).toFixed(3)})`);
      g.fillStyle=v; g.fillRect(0,0,VIEW_W,VIEW_H);
    }
  } else if(C){
    g.fillStyle=hex('#FFFFFF',0.16+0.10*Math.sin(S.t*3));
    g.beginPath(); g.arc(cxp,cyp-30,4+Math.sin(S.t*2)*2,0,6.283); g.fill();
  }
}

/* ---------------------------------------------------------- THE CREATION */
function drawCreationInner(g){
  const K=ARMORS.creation.key, V=ARMORS.creation.sub;
  const bg=g.createLinearGradient(0,0,0,VIEW_H);
  bg.addColorStop(0,hex(V,0.16)); bg.addColorStop(1,hex('#08040C',0));
  g.fillStyle=bg; g.fillRect(0,0,VIEW_W,VIEW_H);
  // real ground, faintly, so you can tell where you actually still have some
  g.strokeStyle=hex(V,0.30); g.lineWidth=2;
  for(const r of solidRuns()){
    g.beginPath(); let first=true;
    for(let x=r[0];x<=r[1];x+=16){
      const yy=terrainY(x); if(yy===null) continue;
      const sx=wx(x,1), sy=wy(yy,1);
      if(sx<-200||sx>VIEW_W+200) continue;
      if(first){ g.moveTo(sx,sy); first=false; } else g.lineTo(sx,sy);
    }
    g.stroke();
  }
  // where it has to reach, which is the only part of the room this armour
  // is prepared to admit exists
  if(S.paintGoal){
    const gx=wx(S.paintGoal,1), gy2=wy(terrainYSafe(S.paintGoal),1);
    if(gx>-200&&gx<VIEW_W+200){
      g.save(); g.strokeStyle=hex(K,0.34); g.lineWidth=1.4; g.setLineDash([4,7]);
      g.beginPath(); g.moveTo(gx,gy2-VIEW_H*0.35); g.lineTo(gx,gy2+40); g.stroke();
      g.restore(); g.setLineDash([]);
    }
  }
  // what you have made, drying as you look at it
  g.save(); g.lineCap='round';
  for(let i=1;i<S.trail.length;i++){
    const a=S.trail[i-1], b=S.trail[i];
    const ax=wx(a.x,1), ay=wy(a.y,1), bx2=wx(b.x,1), by2=wy(b.y,1);
    if(bx2<-200||ax>VIEW_W+200) continue;
    const dry=clamp(b.age/PAINT_DRY,0,1);
    g.strokeStyle=dry<1?hex(K,0.95-dry*0.55):hex('#6b5a2a',0.35);
    g.lineWidth=dry<1?4-dry*2:1.4;
    g.shadowColor=hex(K,0.8); g.shadowBlur=dry<1?14*(1-dry):0;
    g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx2,by2); g.stroke();
    if(dry>=1&&(i%7===0)){ g.fillStyle=hex('#6b5a2a',0.5); g.fillRect(bx2,by2,2,7); }
  }
  g.restore();
  const px=wx(player.x,1), py=wy(player.y,1);
  // the aim of the next stroke, held out in front of you
  if(S.paint>0&&!S.stranded){
    const L2=132, ex=px+Math.cos(S.paintAng)*L2, ey=py+Math.sin(S.paintAng)*L2;
    g.save(); g.setLineDash([3,6]); g.strokeStyle=hex(K,0.5); g.lineWidth=1.6;
    g.beginPath(); g.moveTo(px,py); g.lineTo(ex,ey); g.stroke();
    g.restore(); g.setLineDash([]);
  }
  armorFigure(g,px,py,32,K,0);
}

/* ----------------------------------------------------------- THE ARCHIVE */
function drawArchiveInner(g){
  const K=ARMORS.archive.key, SUB=ARMORS.archive.sub, T=S.archTrack;
  g.lineWidth=1; g.strokeStyle=hex(SUB,0.9);
  const step=40, ox=-((cam.x)%step), oy=-((cam.y)%step);
  g.beginPath();
  for(let x=ox;x<VIEW_W+step;x+=step){ g.moveTo(x,0); g.lineTo(x,VIEW_H); }
  for(let y=oy;y<VIEW_H+step;y+=step){ g.moveTo(0,y); g.lineTo(VIEW_W,y); }
  g.stroke();
  if(!T||!T.length) return;
  const vis=Math.min(S.archIdx+1,T.length-1);
  for(let i=0;i<=vis;i++){
    const n=T[i], px=wx(n.x,1), py=wy(n.y,1), hw=n.w/2;
    if(px<-260||px>VIEW_W+260) continue;
    const done=i<=S.archIdx, bad=!n.ok;
    g.save(); g.shadowColor=hex(bad?'#FF4A4A':K,0.8); g.shadowBlur=done?14:8;
    g.strokeStyle=hex(bad?'#FF4A4A':K,done?0.95:0.6); g.lineWidth=n.ground?3:2;
    g.beginPath(); g.moveTo(px-hw,py); g.lineTo(px+hw,py); g.stroke();
    g.beginPath(); g.moveTo(px-hw,py); g.lineTo(px-hw+12,py+13);
    g.moveTo(px+hw,py); g.lineTo(px+hw-12,py+13); g.stroke();
    g.restore();
    setFont(g,400,10,MONO,'0.12em'); g.textAlign='center';
    g.fillStyle=hex(bad?'#FF4A4A':K,0.45);
    g.fillText(bad?'UNDEFINED':(n.ground?'STONE':('0x'+(i*17%256).toString(16).toUpperCase().padStart(2,'0'))),px,py+26);
    clearSpace(g);
  }

  /* The aim, and the arc it computes for it. This is the whole of what the
     armour is offering: it will tell you exactly where you are going to land,
     and it will be right, and it will never say whether that is anywhere. */
  const a=T[S.archIdx], b=T[S.archIdx+1];
  if(a&&b&&!S.archDash&&!S.archUndef){
    const hit=archSolve(S.archAng,a,b);
    const good=hit&&Math.abs(hit.x-b.x)<=b.w/2;
    const col=good?K:'#FF4A4A';
    const vx0=Math.cos(S.archAng)*ARCH_V, vy0=-Math.sin(S.archAng)*ARCH_V;
    const tof=hit?hit.t:1.1;
    g.save(); g.setLineDash([4,7]); g.lineWidth=1.5; g.strokeStyle=hex(col,0.62);
    g.beginPath();
    for(let k=0;k<=34;k++){
      const tt=tof*k/34;
      const xx=wx(a.x+vx0*tt,1), yy=wy(a.y+vy0*tt+0.5*ARCH_G*tt*tt,1);
      if(k===0) g.moveTo(xx,yy); else g.lineTo(xx,yy);
    }
    g.stroke(); g.restore(); g.setLineDash([]);
    if(hit){
      const lx=wx(hit.x,1), ly=wy(b.y,1);
      g.strokeStyle=hex(col,0.9); g.lineWidth=2;
      g.beginPath(); g.moveTo(lx,ly-13); g.lineTo(lx,ly+13); g.stroke();
    }
    const d=Math.round(b.x-a.x), miss=hit?Math.round(hit.x-b.x):null;
    setFont(g,400,us(11),MONO,'0.16em'); g.textAlign='center';
    g.fillStyle=hex(col,0.68);
    const mid=(wx(a.x,1)+wx(b.x,1))/2;
    g.fillText(b.ok
      ? `θ ${(S.archAng*180/Math.PI).toFixed(1)}°   d ${d}   Δ ${miss>0?'+':''}${miss}`
      : `θ = 0/0   d ${d}   OUT OF RANGE`,
      mid,Math.min(wy(a.y,1),wy(b.y,1))-116);
    clearSpace(g);
  }
  if(S.archUndef){
    // the blueprint tears
    g.save(); g.strokeStyle=hex('#FF4A4A',0.5+0.3*Math.sin(S.t*22)); g.lineWidth=2;
    for(let i=0;i<7;i++){
      const yy=(i*137+((S.t*260)%VIEW_H))%VIEW_H;
      g.beginPath(); g.moveTo(0,yy); g.lineTo(VIEW_W,yy+rr(-8,8)); g.stroke();
    }
    g.restore();
  }
  const px=wx(player.x,1), py=wy(player.y,1);
  armorFigure(g,px,py,32,K,0);
}

function drawArmorHUD(g,which){
  const A=ARMORS[which];
  const rx=VIEW_W-us(34), ry=us(42);
  g.textAlign='right';
  setFont(g,300,us(15),SANS,'0.34em');
  g.fillStyle=hex(A.key,0.85); g.fillText(A.name,rx,ry);
  setFont(g,400,us(12),MONO,'0.20em');
  let line='';
  // Metrics that only ever go up, and never divulge a denominator. You cannot
  // read your remaining runway off a career, or off a habit streak.
  if(which==='climb'){
    // a metric that only goes up, beside the only number that matters
    const kpi=Math.round(100-38*Math.pow(0.72,Math.max(0,(S.course||[]).indexOf(S.onPlat))));
    line=`KPI ${kpi}%  //  REVIEW IN ${Math.max(0,S.armT).toFixed(1)}s`;
  } else if(which==='routine'){
    line=`DAY ${String(S.routineIdx).padStart(2,'0')}/${STAIR_STEPS}  //  CADENCE ${S.cadence}  //  ${Math.max(0,S.armT).toFixed(0)}s`;
    if(S.stumbles) line+=`  //  ${S.stumbles} MISSED`;
  } else if(which==='dogma'){
    // a metric that cannot go down, beside two that can
    line=`PURITY 100%  //  ${String(Math.round(S.dogV)).padStart(3,' ')} u/s  //  CLEARED ${S.dogHits+S.dogSlams}  //  ${Math.max(0,S.armT).toFixed(0)}s`;
  } else if(which==='refuge'){
    const c=S.companion;
    // the one number in here, and it is about you, not about how long they have
    line=`HARMONY ${c&&!c.gone?String(Math.round(clamp(S.thread/REFUGE_SLACK,0,1)*100)).padStart(3,' ')+'%':'  --'}`;
  } else if(which==='creation'){
    // a fuel readout that says how much is left but never how much was needed
    line=`CANVAS ${String(Math.round(S.paint/PAINT_TOTAL*100)).padStart(3,' ')}% FUEL`;
  } else {
    line=`EVAL ${S.archUndef?'UNDEFINED':'VALID'}  //  SOLVED ${S.archIdx}`
        +(S.archErr?`  //  ${S.archErr} REDERIVED`:'')+`  //  ${Math.max(0,S.armT).toFixed(0)}s`;
  }
  g.fillStyle=hex(A.key,0.55); g.fillText(line,rx,ry+us(22));
  if(S.stranded){
    const f=0.45+0.55*Math.abs(Math.sin(S.t*3.4));
    g.fillStyle=hex('#FF4A4A',f); setFont(g,400,us(12),MONO,'0.22em');
    g.fillText({climb:'PROMOTION CEILING REACHED',routine:'THE STAIRS GO NO HIGHER',
                dogma:'THE ROAD CAME DOWN WITH IT',refuge:'LIFESPAN COMPLETE',
                creation:'OUT OF PAINT',archive:'UNDEFINED / DIVIDE BY ZERO'}[which]||'',rx,ry+us(46));
    g.fillStyle=hex('#FF4A4A',0.34+0.2*Math.sin(S.t*1.7)); setFont(g,400,us(11),MONO,'0.18em');
    g.fillText(`PRESSURE RETURNING  ${Math.round(S.dread*100)}%`,rx,ry+us(68));
  }
  clearSpace(g);
}

/* ------------------------------------------------------- transition draw - */
function drawEquip(tr){
  const t=tr.t;
  const p2=inv(0.20,0.50,t);           // desaturate + black out
  const p3=inv(0.50,0.70,t);           // lock in
  if(t<0.66){
    drawRaw({desat:p2,dark:p2*0.98,blur:p2*7});
  } else {
    ctx.fillStyle=ARMORS[tr.armor].dark; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  }
  // Phase 1: geometric blinder lines sweep in from the screen edges
  const p1=inv(0,0.20,t), e=easeOutCubic(p1);
  ctx.fillStyle='#000';
  const bw=VIEW_W*0.5*e, bh=VIEW_H*0.5*e;
  ctx.fillRect(0,0,bw,VIEW_H); ctx.fillRect(VIEW_W-bw,0,bw,VIEW_H);
  ctx.fillRect(0,0,VIEW_W,bh*0.62); ctx.fillRect(0,VIEW_H-bh*0.62,VIEW_W,bh*0.62);
  ctx.strokeStyle=hex(ARMORS[tr.armor].key,0.5*(1-p1)); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(bw,0); ctx.lineTo(bw,VIEW_H); ctx.moveTo(VIEW_W-bw,0); ctx.lineTo(VIEW_W-bw,VIEW_H); ctx.stroke();
  // Phase 3: the armour opens
  if(p3>0){ drawArmored(ctx,tr.armor,easeOutCubic(p3),1); }
}

function drawShatter(tr){
  const t=tr.t, soft=tr.soft;
  const fr=inv(0,soft?0.5:0.30,t);
  const rush=inv(soft?0.35:0.30,soft?1.2:0.80,t);
  const shardE=easeOutCubic(rush);

  if(rush<=0.001){
    ctx.drawImage(snapCv,0,0,VIEW_W,VIEW_H);
  } else {
    // the world rushes back in, overwhelming and at full scale
    ctx.save();
    const sc=lerp(REDUCED?1.0:1.10,1.0,easeOutCubic(rush));
    ctx.translate(VIEW_W/2,VIEW_H/2); ctx.scale(sc,sc); ctx.translate(-VIEW_W/2,-VIEW_H/2);
    ctx.globalAlpha=clamp(rush*1.7,0,1);
    drawRaw({});
    ctx.restore();
    // the blinders fly apart
    ctx.save(); ctx.globalAlpha=clamp(1-rush*1.25,0,1);
    for(const s of tr.shards){
      ctx.save();
      const off=shardE*(soft?260:540)*s.sp;
      ctx.translate(VIEW_W/2+s.dx*off,VIEW_H/2+s.dy*off);
      ctx.rotate(s.rot*shardE); ctx.translate(-VIEW_W/2,-VIEW_H/2);
      const p=shardTri(s);
      ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); ctx.lineTo(p[1][0],p[1][1]); ctx.lineTo(p[2][0],p[2][1]); ctx.closePath();
      ctx.clip(); ctx.drawImage(snapCv,0,0,VIEW_W,VIEW_H);
      ctx.restore();
    }
    ctx.restore();
  }
  // Phase 1: the fracture
  if(fr<1&&!soft){
    ctx.save(); ctx.strokeStyle=hex('#FFFFFF',0.9*(1-fr*0.4)); ctx.lineWidth=1.4;
    ctx.shadowColor='#fff'; ctx.shadowBlur=12;
    const R=Math.hypot(VIEW_W,VIEW_H)*0.6*easeOutCubic(fr);
    for(const s of tr.shards){
      ctx.beginPath(); ctx.moveTo(VIEW_W/2,VIEW_H/2);
      let x=VIEW_W/2,y=VIEW_H/2;
      for(let k=1;k<=4;k++){
        x=VIEW_W/2+s.dx*R*(k/4)+Math.sin(k*3+s.rot*9)*11;
        y=VIEW_H/2+s.dy*R*(k/4)+Math.cos(k*2+s.rot*7)*11;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
  if(!soft&&t>0.24&&t<0.34){ ctx.fillStyle=hex('#FFFFFF',(1-Math.abs(t-0.29)/0.05)*0.5); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
  if(soft&&t>0.2&&t<0.9){ ctx.fillStyle=hex('#FFD166',(1-Math.abs(t-0.55)/0.35)*0.14); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
}

/* What a slip looks like from the inside. The world is drawn once — jolted off
   its axis, too soft and too dark to read — and then the frame is put straight
   back over it with a band or two missing. The first time you get an edge of it
   and no time at all. It is not a glimpse of the ridge. It is the suspicion
   that there is one. */
function drawTear(tr){
  const g=tr.g, u=(g-1)/5, k=clamp(tr.t/tr.dur,0,1);
  // framed on the ground you are actually standing over, not on the ladder's
  // idea of where you are — by now the ladder is a thousand units above it
  const cx0=cam.x, cy0=cam.y;
  const fx=(S.courseFrom?S.courseFrom.x:player.x);
  cam.x=fx-VIEW_W*0.34+Math.sin(tr.t*47)*9*g;
  cam.y=terrainYSafe(fx)-VIEW_H*0.58+Math.cos(tr.t*39)*7*g;
  drawRaw({desat:lerp(0.70,0.06,u),dark:lerp(0.72,0.03,u),blur:lerp(12,1.6,u)});
  cam.x=cx0; cam.y=cy0;

  // the armour, still up, with the slip cut out of it
  const open=Math.sin(Math.PI*Math.min(1,k*1.12)), bands=[];
  ctx.save();
  ctx.beginPath(); ctx.rect(0,0,VIEW_W,VIEW_H);
  for(const b of tr.bands){
    const y=b.yf*VIEW_H, h=Math.max(3,b.hf*VIEW_H*open);
    bands.push([y,h]); ctx.rect(-40,y,VIEW_W+80,h);
  }
  ctx.clip('evenodd');
  ctx.drawImage(snapCv,0,0,VIEW_W,VIEW_H);
  ctx.restore();

  // torn edges, lit in the armour's own colour, because it is the armour tearing
  ctx.save();
  ctx.strokeStyle=hex(P.climb.cyan,0.55*open); ctx.lineWidth=1;
  ctx.shadowColor=hex(P.climb.cyan,0.85); ctx.shadowBlur=10;
  ctx.beginPath();
  for(const b of bands){ ctx.moveTo(-40,b[0]); ctx.lineTo(VIEW_W+40,b[0]);
                         ctx.moveTo(-40,b[0]+b[1]); ctx.lineTo(VIEW_W+40,b[0]+b[1]); }
  ctx.stroke(); ctx.restore();
  if(k<0.22){ ctx.fillStyle=hex('#FFFFFF',(1-k/0.22)*0.18); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
}

/* You learn the reach of a lie by having lived one. Once you have worn an
   armour and taken it off, the raw world will show you the envelope of what it
   buys from where you are standing — never from inside it, and never before.
   It shows you the two extremes; what a mixture of them does is still yours to
   work out, against a landscape only this state lets you see. */
function drawReach(sel){
  if(!L.proto||!sel||!lived.has(sel)||!S.unlocked.has(sel)) return;
  const K=ARMORS[sel].key, px=wx(player.x,1), py=wy(player.y,1);
  const ends=[];
  if(sel==='climb'){
    // the shape of the thing, laid over the drop it proposes to cross
    const course=buildClimbCourse(player.x,player.y), last=course[course.length-1];
    ctx.save();
    ctx.setLineDash([5,7]); ctx.lineWidth=1.4; ctx.strokeStyle=hex(K,0.45);
    for(const p of course) ctx.strokeRect(wx(p.x,1)-p.w/2,wy(p.y,1),p.w,PLAT_H);
    ctx.setLineDash([]);
    setFont(ctx,400,us(9),MONO,'0.20em'); ctx.textAlign='center';
    ctx.fillStyle=hex(K,0.5);
    ctx.fillText(courseTime(course).toFixed(0)+'s OF IT',wx(last.x,1),wy(last.y,1)-us(16));
    clearSpace(ctx); ctx.restore();
    return;
  } else if(sel==='routine'){
    ends.push({x:player.x+STAIR_DX*STAIR_STEPS,y:player.y+STAIR_DY*STAIR_STEPS,t:STAIR_STEPS+' MORNINGS'});
  } else return;

  ctx.save();
  ctx.setLineDash([6,9]); ctx.lineWidth=1.5; ctx.strokeStyle=hex(K,0.42);
  ctx.beginPath();
  for(const e of ends){ ctx.moveTo(px,py); ctx.lineTo(wx(e.x,1),wy(e.y,1)); }
  ctx.stroke();
  // every mixture of the two lands somewhere on the line between their extremes
  // — when there are two. The routine offers exactly one, and always has.
  if(ends.length>1){
    ctx.strokeStyle=hex(K,0.26);
    ctx.beginPath();
    ctx.moveTo(wx(ends[0].x,1),wy(ends[0].y,1)); ctx.lineTo(wx(ends[1].x,1),wy(ends[1].y,1));
    ctx.stroke();
  }
  ctx.setLineDash([]);
  for(const e of ends){
    const ex=wx(e.x,1), ey=wy(e.y,1);
    ctx.fillStyle=hex(K,0.5);
    ctx.beginPath(); ctx.arc(ex,ey,3.4,0,6.283); ctx.fill();
    if(e.t){
      setFont(ctx,400,us(9),MONO,'0.20em'); ctx.textAlign='center';
      ctx.fillStyle=hex(K,0.44); ctx.fillText(e.t,ex,ey-us(12)); clearSpace(ctx);
    }
  }
  ctx.restore();
}

/* ------------------------------------------------------------ armor wheel */
function drawWheel(){
  // pulled in on a narrow screen so the labels stay inside the frame
  const cx=VIEW_W/2, cy=VIEW_H/2, R=Math.min(us(L.shore?152:132),VIEW_W*0.30);
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const a=smooth(clamp(S.wheelT/0.18,0,1));

  // Existential Pressure Gauge — the ring at the centre of every choice
  ctx.save(); ctx.globalAlpha=a;
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.14)';
  ctx.beginPath(); ctx.arc(cx,cy,us(44),0,6.283); ctx.stroke();
  // the part of it that no longer comes off, whatever you do
  if(S.floor>0.02){
    ctx.lineWidth=3.4; ctx.strokeStyle=hex('#FF6B6B',0.30);
    ctx.beginPath(); ctx.arc(cx,cy,us(44),-Math.PI/2,-Math.PI/2+6.283*S.floor); ctx.stroke();
  }
  ctx.lineWidth=3.4; ctx.strokeStyle=hex(S.dread>0.75?'#FF6B6B':'#FFFFFF',0.68);
  ctx.beginPath(); ctx.arc(cx,cy,us(44),-Math.PI/2,-Math.PI/2+6.283*S.dread); ctx.stroke();
  setFont(ctx,400,us(9),MONO,'0.22em'); ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,0.34)'; ctx.fillText('PRESSURE',cx,cy+us(3));
  ctx.fillStyle='rgba(255,255,255,0.55)'; setFont(ctx,400,us(12),MONO,'0.14em');
  ctx.fillText(Math.round(S.dread*100)+'%',cx,cy+us(20));
  clearSpace(ctx);

  drawReach(S.wheelSel);

  const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const slots=[];
  const used=new Set();
  L.armors.forEach(k=>{ const d=DIRV[WHEEL_SLOTS[k]]; slots.push({k,dx:d[0],dy:d[1]}); used.add(WHEEL_SLOTS[k]); });
  // the armours this level does not offer sit greyed out in the empty slots
  ['up','right','down','left'].forEach(dirn=>{
    if(used.has(dirn)) return;
    const ghost=Object.keys(ARMORS).find(k=>WHEEL_SLOTS[k]===dirn&&!L.armors.includes(k));
    if(ghost){ const d=DIRV[dirn]; slots.push({k:ghost,dx:d[0],dy:d[1]}); }
  });
  // The shore: all six projects of meaning, all of them already spent. Four
  // slots cannot say that, so the wheel opens all the way round.
  if(L.shore){
    slots.length=0;
    Object.keys(ARMORS).forEach((k,i)=>{
      const ang=-Math.PI/2+i/6*6.283;
      slots.push({k,dx:Math.cos(ang),dy:Math.sin(ang)});
    });
  }
  for(const s of slots){
    const A=ARMORS[s.k], unlocked=S.unlocked.has(s.k), sel=S.wheelSel===s.k&&unlocked;
    const x=cx+s.dx*R, y=cy+s.dy*R;
    ctx.globalAlpha=a*(unlocked?1:0.30);
    ctx.lineWidth=1; ctx.strokeStyle=hex('#FFFFFF',0.14);
    ctx.beginPath(); ctx.moveTo(cx+s.dx*us(52),cy+s.dy*us(52)); ctx.lineTo(x-s.dx*us(34),y-s.dy*us(34)); ctx.stroke();

    const box=us(34+(sel?6:0));
    ctx.save();
    if(sel){ ctx.shadowColor=hex(A.key,0.9); ctx.shadowBlur=22; }
    ctx.lineWidth=sel?2.2:1.4;
    ctx.strokeStyle=hex(unlocked?(sel?A.key:'#FFFFFF'):'#FFFFFF',sel?1:0.42);
    ctx.fillStyle=hex(A.key,sel?0.16:0.0);
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x-box/2,y-box/2,box,box,us(4)); else ctx.rect(x-box/2,y-box/2,box,box);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.fillStyle=hex(unlocked?(sel?A.key:'#FFFFFF'):'#FFFFFF',unlocked?0.9:0.4);
    setFont(ctx,400,us(17),SANS,'0px'); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(A.glyph,x,y+1); ctx.textBaseline='alphabetic';
    // struck through: this one has already been tried, and it broke
    if(L.shore){
      ctx.strokeStyle=hex('#FFFFFF',0.34); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(x-box/2,y+box/2); ctx.lineTo(x+box/2,y-box/2); ctx.stroke();
    }

    setFont(ctx,300,us(11),SANS,'0.24em');
    ctx.fillStyle=hex('#FFFFFF',sel?0.85:0.42);
    const ly=y+s.dy*us(40)+us(s.dy>0?18:s.dy<0?-24:-30);
    ctx.fillText(unlocked?A.name:(L.shore?'EXHAUSTED':'LOCKED'),x,ly);
    if(unlocked&&sel){
      setFont(ctx,400,us(9),MONO,'0.18em'); ctx.fillStyle=hex(A.key,0.6);
      ctx.fillText(A.theme,x,ly+us(16));
    }
    clearSpace(ctx);
  }
  ctx.globalAlpha=a*0.5;
  setFont(ctx,300,us(12),SANS,'0.30em'); ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText(L.shore?'THERE IS NOTHING LEFT TO EQUIP'
    :(IS_TOUCH?'DRAG TO AN ARMOR · RELEASE TO EQUIP':'AIM WITH MOUSE OR ARROWS · RELEASE TO EQUIP'),cx,VIEW_H-us(54));
  clearSpace(ctx);
  ctx.restore();
}

/* ---------------------------------------------------------- text overlays */
function drawPromptLayer(){
  if(!activePrompt) return;
  const a=promptAlpha(activePrompt);
  if(a<=0.002) return;
  // out of the way of the hands while an armour is on
  const y=(S.mode==='armored')?VIEW_H*0.145:VIEW_H*0.775;
  ctx.textAlign='center';
  const size=clamp(VIEW_W*0.021,us(17),us(27));
  setFont(ctx,200,size,SANS,'0.10em');
  ctx.fillStyle=hex(activePrompt.tint,a);
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=18;
  wrapText(activePrompt.text,VIEW_W/2,y,VIEW_W*0.78,size*1.55);
  ctx.shadowBlur=0; clearSpace(ctx);
}
function wrapText(text,x,y,maxW,lh){
  const words=text.split(' '); const lines=[]; let line='';
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW&&line){ lines.push(line); line=w; } else line=test;
  }
  lines.push(line);
  const y0=y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,y0+i*lh));
}

/* The question the shore asks, and the words it closes on. */
function drawShoreUI(){
  if(S.act==='ask'||S.act==='nihil'){
    const a=S.act==='ask'?smooth(clamp(S.actT/1.3,0,1)):clamp(1-S.actT/0.7,0,1);
    if(a>0.01){
      ctx.textAlign='center';
      setFont(ctx,200,clamp(VIEW_W*0.026,us(21),us(34)),SANS,'0.12em');
      ctx.shadowColor='rgba(0,0,0,0.85)'; ctx.shadowBlur=24;
      ctx.fillStyle=hex('#F2F7FF',a*0.90);
      // above the wall, so the wall can go on showing you what it is showing you
      ctx.fillText('"Was it all meaningless?"',VIEW_W/2,VIEW_H*0.125);
      ctx.shadowBlur=0; clearSpace(ctx);
      for(const b of choiceBoxes()){
        const sel=S.choiceSel===b.key;
        ctx.globalAlpha=a;
        ctx.lineWidth=1.4; ctx.strokeStyle=hex('#F2F7FF',sel?0.92:0.32);
        ctx.fillStyle=hex('#F2F7FF',sel?0.13:0.03);
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(b.x,b.y-b.h/2,b.w,b.h,us(3)); else ctx.rect(b.x,b.y-b.h/2,b.w,b.h);
        ctx.fill(); ctx.stroke();
        setFont(ctx,300,us(15),SANS,'0.42em');
        ctx.fillStyle=hex('#F2F7FF',sel?0.95:0.66);
        ctx.fillText(b.label,b.x+b.w/2+us(7),b.y+us(5));
        clearSpace(ctx);
        ctx.globalAlpha=1;
      }
    }
  }
  // the epilogue, line by line, over a shore that keeps widening
  if(S.act==='epilogue'&&S.epiI>=0&&S.epiI<EPILOGUE.length){
    const t=S.epiT;
    const a=smooth(inv(0,1.8,t))*(1-smooth(inv(EPI_LINE-1.6,EPI_LINE,t)));
    if(a>0.01){
      const size=clamp(VIEW_W*0.020,us(18),us(29));
      ctx.textAlign='center';
      setFont(ctx,200,size,SANS,'0.12em');
      ctx.shadowColor='rgba(0,0,0,0.75)'; ctx.shadowBlur=20;
      ctx.fillStyle=hex('#F2F7FF',a*0.88);
      EPILOGUE[S.epiI].split('\n').forEach((l,i)=>ctx.fillText(l,VIEW_W/2,VIEW_H*0.28+i*size*1.7));
      ctx.shadowBlur=0; clearSpace(ctx);
    }
  }
  if(S.act==='over'){
    const a=smooth(clamp(S.actT/2.4,0,1));
    ctx.textAlign='center';
    setFont(ctx,100,clamp(VIEW_W*0.030,us(24),us(40)),SANS,'0.52em');
    ctx.fillStyle=hex('#F8FAFC',a*0.92);
    ctx.fillText('— LUCID —',VIEW_W/2+us(10),VIEW_H*0.29);
    clearSpace(ctx);
  }
}

/* After the shore. The quiet that the whole game was walking towards, with
   the drone still holding the chord it finally resolved to. */
function drawComplete(){
  ctx.fillStyle='#04070d'; ctx.fillRect(0,0,VIEW_W,VIEW_H);
  const t=S.doneT||0;
  for(const s of stars){
    const tw=0.5+0.5*Math.sin(t*1.1+s.tw);
    const px=(((s.x*1.7)%VIEW_W)+VIEW_W)%VIEW_W, py=(((s.y*3.1)%VIEW_H)+VIEW_H)%VIEW_H;
    ctx.fillStyle=hex('#F2F7FF',0.30*tw);
    ctx.beginPath(); ctx.arc(px,py,us(s.r*0.95),0,6.283); ctx.fill();
  }
  ctx.textAlign='center';
  const a=smooth(clamp(t/3.0,0,1));

  ctx.fillStyle=hex('#F8FAFC',a*0.92);
  ctx.fillText('LUCID',VIEW_W/2+VIEW_W*0.024,VIEW_H*0.42);
  const a2=smooth(clamp((t-2.2)/2.6,0,1));

  ctx.fillStyle=hex('#F8FAFC',a2*0.50);
  ctx.fillText('The illusion gave you safety. The truth gives you the world.',VIEW_W/2,VIEW_H*0.42+us(54));
  const a3=smooth(clamp((t-5.2)/2.6,0,1));
  setFont(ctx,400,us(10),MONO,'0.26em');
  ctx.fillStyle=hex('#38BDF8',a3*0.42);
  ctx.fillText('AFTER ERNEST BECKER · THE DENIAL OF DEATH',VIEW_W/2,VIEW_H*0.63);
  ctx.fillStyle=hex('#FFFFFF',a3*0.20);
  ctx.fillText('RELOAD TO WALK THE RIDGE AGAIN',VIEW_W/2,VIEW_H*0.70);
  clearSpace(ctx);

/* ---------------------------------------------------------------- frame -- */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(SCALE,0,0,SCALE,0,0);

  if(S.screen==='title'){ drawTitle(); return; }
  if(S.screen==='interstitial'){ drawInterstitial(); return; }
  if(S.screen==='complete'){ drawComplete(); return; }

  if(S.tear){
    drawTear(S.tear); drawCorner();
    if(S.fade>0.002){ ctx.fillStyle=hex('#000000',S.fade); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
    return;
  }

  if(S.transition){
    if(S.transition.type==='equip') drawEquip(S.transition);
    else drawShatter(S.transition);
  } else if(S.mode==='lucid'){
    drawRaw(L.shore?{dark:S.dim}:{});
  } else {
    drawArmored(ctx,S.armor,1,1);
  }

  if(S.wheelOpen){ S.wheelT+=S.dt; drawWheel(); }
  drawPromptLayer();
  if(L.shore) drawShoreUI();
  if(S.intro>0) drawIntroLabel();
  if(!S.wheelOpen&&S.intro<=0) drawHints();
  drawCorner();

  // collapse: the screen holds still while you cannot. The wheel, if you have
  // reached for it, owns the middle of the screen instead.
  if(S.collapsed>0&&!S.wheelOpen){
    ctx.textAlign='center'; setFont(ctx,300,us(12),SANS,'0.34em');
    ctx.fillStyle=hex('#FFFFFF',0.30+0.16*Math.sin(S.t*3));
    ctx.fillText('YOU CANNOT MOVE',VIEW_W/2,VIEW_H*0.5);
    // you can still reach for something. That is the whole of the game.
    setFont(ctx,300,us(11),SANS,'0.30em');
    ctx.fillStyle=hex('#FFFFFF',0.34+0.2*Math.sin(S.t*3));
    ctx.fillText(IS_TOUCH?'HOLD TWO THUMBS':'HOLD SPACE',VIEW_W/2,VIEW_H*0.5+us(30));
    clearSpace(ctx);
  }
  if(S.fade>0.002){ ctx.fillStyle=hex('#000000',S.fade); ctx.fillRect(0,0,VIEW_W,VIEW_H); }
  const cls=(S.mode==='lucid'?'lucid ':'')+(ptr.down?'dragging':'');
  if(cls!==document.body.className) document.body.className=cls;   // avoid a style recalc every frame
}

/* ------------------------------------------------------------------ loop - */
loadLevel(0);
S.intro=0;                       // the title screen holds until the player begins

let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,1/20);
  S.dt=dt;
  // A throw in here used to end the game: the next frame was only ever asked
  // for after both of these returned, so one bad frame meant a dead picture and
  // a player holding keys at it. A bad frame is now just a bad frame.
  try{ update(dt); draw(); }
  catch(e){ if(!frame.told){ frame.told=1; console.error('frame',e); } }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
